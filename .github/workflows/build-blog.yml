name: Build blog

# Fires when Supabase publishes a post (the publish trigger POSTs to
# /repos/Fredlumiere/apiant-website/dispatches with event_type=blog_publish).
# Also runnable manually for full rebuilds.

on:
  repository_dispatch:
    types: [blog_publish]
  workflow_dispatch:
    inputs:
      post_id:
        description: "Post UUID to rebuild (leave blank for --all)"
        required: false

# Serialize blog builds so two near-simultaneous publishes don't race the
# commit. We don't cancel in-progress runs — each one needs to finish so
# every post lands.
concurrency:
  group: build-blog
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run build_blog.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          POST_ID: ${{ github.event.client_payload.post_id || inputs.post_id }}
        run: |
          if [ -n "$POST_ID" ]; then
            python scripts/build_blog.py --post-id "$POST_ID"
          else
            python scripts/build_blog.py --all
          fi

      - name: Regenerate sitemap
        run: python scripts/generate_sitemap.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog/ sitemap.xml
          if git diff --cached --quiet; then
            echo "No blog changes to commit."
            exit 0
          fi
          SLUG="${{ github.event.client_payload.slug }}"
          # Note: commit does NOT carry [skip translations] anymore. The
          # downstream deploy.yml will run update_translations.sh so blog
          # posts get regenerated across all 19 locales.
          MSG="Publish blog post ${SLUG:-(full rebuild)}"
          git commit -m "$MSG"
          git pull --rebase origin main
          git push
