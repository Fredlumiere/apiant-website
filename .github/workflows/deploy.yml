name: Deploy to apiant.com

on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize deploys. Without this, two pushes a minute apart spawn two
# parallel translation+commit chains that race on the auto-regenerate
# commit and fail with merge conflicts. cancel-in-progress: false because
# every push needs to ship; we just don't want them stepping on each other.
concurrency:
  group: deploy-apiant-com
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Bounded, not 0: the full history is 2.4 GB of packed image blobs
          # and locale auto-commits, and fetching it stalled two deploys on
          # 2026-08-25. 50 commits is plenty for the rebase step below.
          fetch-depth: 50

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      # Refresh blog HTML from Supabase before translation. Closes the race
      # where build-blog.yml and deploy.yml start within seconds of each
      # other — deploy used to translate stale blog HTML and then win the
      # rebase, reverting the build-blog output (avif images, descriptive
      # alt text, data-tags). Running build_blog here makes deploy
      # self-sufficient. Skipped at the shell level if Supabase env vars
      # aren't set (forks without credentials).
      - name: Refresh blog HTML from Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Supabase secrets not configured; skipping blog refresh."
            exit 0
          fi
          python scripts/build_blog.py --all

      - name: Regenerate localized pages
        env:
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
        # Always run. The previous [skip translations] gate was fragile
        # (any commit body that even mentioned the marker would skip it).
        # Translation is ~3 min and idempotent, so the cost of always-run
        # is much smaller than the cost of a silently-skipped translation.
        run: bash scripts/update_translations.sh

      - name: Guard against legacy webhook URLs in frontend
        # Forms must route through the validated server endpoints
        # (submit-lead / submit-apiapps), never POST directly to the legacy
        # apiant.com/webhook/* URLs. backup/ and .claude/ are not served.
        run: |
          # Scope to English source (the source of truth). Locale pages are
          # generated from it, so a clean English tree guarantees clean locales.
          hits=$(grep -rlE "apiant\.com/webhook/(e68fef48|9d4c71be)" --include='*.html' . \
                   | grep -vE "^\./(es|fr|zh|hi|ar|bn|pt|ru|ja|de|ko|it|nl|tr|pl|vi|th|id|sv|he)/" \
                   | grep -vE "/(\.claude|backup|node_modules|other-pages)/" || true)
          if [ -n "$hits" ]; then
            echo "ERROR: legacy webhook URL(s) found in served frontend HTML:"
            echo "$hits"
            exit 1
          fi
          echo "OK: no legacy webhook URLs in served frontend."

      - name: Commit locale changes back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No locale changes to commit."
            exit 0
          fi
          git add -A
          git commit -m "Auto-regenerate localized pages [skip ci]"

          # Push with retries. On conflict, regenerate locales against the
          # latest main and try again (this run's locale output is always
          # "the correct one" for the English source it was built from).
          for attempt in 1 2 3; do
            git fetch origin main
            # If the remote moved, rebase using our generated files as the
            # winner (-X theirs). The build script is deterministic; running
            # it again against the latest English source would produce the
            # same output, so we don't need to actually re-run it.
            if ! git rebase -X theirs origin/main; then
              git rebase --abort || true
              echo "Rebase failed unexpectedly on attempt $attempt"
              exit 1
            fi
            if git push; then
              echo "Pushed on attempt $attempt"
              exit 0
            fi
            echo "Push race on attempt $attempt; retrying..."
            sleep 5
          done
          echo "Failed to push after 3 attempts"
          exit 1

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via rsync
        run: |
          rsync -rltz --omit-dir-times \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.claude/' \
            --exclude='.firecrawl/' \
            --exclude='.uisnap/' \
            --exclude='supabase/' \
            --exclude='backup/' \
            --exclude='docs/' \
            --exclude='other-pages/' \
            --exclude='CLAUDE.md' \
            --exclude='SITE-DOCUMENTATION.md' \
            --exclude='APIANT-Website-Revision-Plan-v2-FINAL.md' \
            --exclude='API-APP-PAGE-PLAYBOOK.md' \
            --exclude='API_APPS_FEATURES.md' \
            --exclude='HOMEPAGE-COPY-WEBFLOW-READY.md' \
            --exclude='ADOPTION-PLAN.md' \
            --exclude='ADOPTION-PLAN.html' \
            --exclude='APACHE-PROXY-SETUP.md' \
            --exclude='apache-vercel-proxy.conf' \
            --exclude='*.py' \
            --exclude='*.md' \
            --exclude='temp.html' \
            --exclude='hq.html' \
            --exclude='blog/_templates/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}

      - name: Sync blog tree with --delete (origin only)
        # Scoped delete for /blog/ on the English root and every locale.
        # Without this, orphaned category/post folders linger forever on
        # origin after rename/removal (see the platform-deep-dives etc.
        # cleanup we had to do manually). The main rsync above stays
        # non-deleting to protect any server-only files in other paths.
        run: |
          for path in blog ar/blog bn/blog de/blog es/blog fr/blog he/blog \
                       hi/blog id/blog it/blog ja/blog ko/blog nl/blog \
                       pl/blog pt/blog ru/blog sv/blog th/blog tr/blog \
                       vi/blog zh/blog; do
            if [ -d "$path" ]; then
              rsync -rltz --omit-dir-times --delete-after \
                --exclude='_templates/' \
                -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
                "$path/" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/$path/"
            fi
          done
