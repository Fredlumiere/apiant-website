name: Deploy to apiant.com

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install Python dependencies
        run: pip install -r scripts/requirements.txt

      - name: Regenerate localized pages
        env:
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
        # Always run. The previous [skip translations] gate was fragile
        # (any commit body that even mentioned the marker would skip it).
        # Translation is ~3 min and idempotent, so the cost of always-run
        # is much smaller than the cost of a silently-skipped translation.
        run: bash scripts/update_translations.sh

      - name: Commit locale changes back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No locale changes to commit."
          else
            git add -A
            git commit -m "Auto-regenerate localized pages [skip ci]"
            # Rebase onto any human pushes that landed during translation,
            # then push. Closes the race where translation runs minutes-long
            # and a human push lands first.
            git pull --rebase origin main
            git push
          fi

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy via rsync
        run: |
          rsync -rltz --omit-dir-times \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.claude/' \
            --exclude='.firecrawl/' \
            --exclude='.uisnap/' \
            --exclude='supabase/' \
            --exclude='backup/' \
            --exclude='docs/' \
            --exclude='other-pages/' \
            --exclude='CLAUDE.md' \
            --exclude='SITE-DOCUMENTATION.md' \
            --exclude='APIANT-Website-Revision-Plan-v2-FINAL.md' \
            --exclude='API-APP-PAGE-PLAYBOOK.md' \
            --exclude='API_APPS_FEATURES.md' \
            --exclude='HOMEPAGE-COPY-WEBFLOW-READY.md' \
            --exclude='ADOPTION-PLAN.md' \
            --exclude='ADOPTION-PLAN.html' \
            --exclude='APACHE-PROXY-SETUP.md' \
            --exclude='apache-vercel-proxy.conf' \
            --exclude='*.py' \
            --exclude='*.md' \
            --exclude='temp.html' \
            --exclude='hq.html' \
            --exclude='blog/_templates/' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}

      - name: Sync blog tree with --delete (origin only)
        # Scoped delete for /blog/ on the English root and every locale.
        # Without this, orphaned category/post folders linger forever on
        # origin after rename/removal (see the platform-deep-dives etc.
        # cleanup we had to do manually). The main rsync above stays
        # non-deleting to protect any server-only files in other paths.
        run: |
          for path in blog ar/blog bn/blog de/blog es/blog fr/blog he/blog \
                       hi/blog id/blog it/blog ja/blog ko/blog nl/blog \
                       pl/blog pt/blog ru/blog sv/blog th/blog tr/blog \
                       vi/blog zh/blog; do
            if [ -d "$path" ]; then
              rsync -rltz --omit-dir-times --delete-after \
                --exclude='_templates/' \
                -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
                "$path/" "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}/$path/"
            fi
          done
