<!-- Blog nav: streamlined version of main site nav. Absolute paths so it
     works from /blog/, /blog/posts/{slug}/, and /blog/category/{slug}/.
     Includes the same .lang-switcher shell as the main site; populated by /js/i18n.js. -->
<header class="blog-nav" style="position:sticky;top:0;z-index:50;background:rgba(12,12,12,0.92);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,0.07);">
  <div class="blog-container" style="display:flex;align-items:center;justify-content:space-between;height:64px;">
    <a href="/" style="display:flex;align-items:center;text-decoration:none;">
      <img alt="APIANT" src="/images/APIANT-LOGO-V4-Dark-Mode.svg" style="height:24px;"/>
    </a>
    <nav style="display:flex;align-items:center;gap:24px;font-family:'DM Sans',sans-serif;font-size:14px;">
      <a href="/blog/" style="color:#f7f8f8;text-decoration:none;font-weight:500;">Blog</a>
      <a href="/platform/" style="color:rgba(247,248,248,0.7);text-decoration:none;">Platform</a>
      <a href="/apps" style="color:rgba(247,248,248,0.7);text-decoration:none;">Connectors</a>

      <!--
        Blog-scoped language switcher. Class is "blog-lang-switcher" (not
        the site-wide "lang-switcher") because localize.py's
        add_language_switcher() decomposes .lang-switcher elements during
        re-runs. Populated by /js/blog-search.js at runtime.
      -->
      <div class="blog-lang-switcher" style="position:relative;display:flex;align-items:center;">
        <button class="blog-lang-switcher-btn" type="button" aria-haspopup="true" aria-expanded="false" style="background:transparent;border:1px solid rgba(255,255,255,0.15);border-radius:6px;padding:6px 10px;color:rgba(255,255,255,0.7);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:'DM Sans',sans-serif;white-space:nowrap;transition:border-color 0.2s,color 0.2s;">
          <svg fill="none" height="14" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="14"><circle cx="12" cy="12" r="10"></circle><line x1="2" x2="22" y1="12" y2="12"></line><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>
          <span class="blog-lang-switcher-current">EN</span>
          <svg fill="none" height="10" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" width="10"><path d="M6 9l6 6 6-6"></path></svg>
        </button>
        <div class="blog-lang-switcher-dropdown"></div>
      </div>

      <a href="/?talk=1" style="display:inline-flex;align-items:center;padding:8px 18px;background:linear-gradient(135deg,#0d7a3a,#1ab759);color:#fff;border-radius:8px;text-decoration:none;font-weight:500;">Start Building</a>
    </nav>
  </div>
</header>
<style>
  .blog-lang-switcher-btn:hover { border-color: rgba(255,255,255,0.35) !important; color: #fff !important; }
  .blog-lang-switcher-dropdown { display:none; position:absolute; top:calc(100% + 4px); right:0; background:#1a1a2e; border:1px solid rgba(255,255,255,0.1); border-radius:8px; padding:4px; min-width:170px; z-index:9999; max-height:420px; overflow-y:auto; box-shadow:0 8px 32px rgba(0,0,0,0.4); }
  .blog-lang-switcher-dropdown.open { display: block; }
  .blog-lang-switcher-dropdown a { display:block; padding:8px 12px; color:rgba(255,255,255,0.85); text-decoration:none; font-size:13px; border-radius:6px; transition:background 0.15s; }
  .blog-lang-switcher-dropdown a:hover { background:rgba(26,183,89,0.15); color:#fff; }
  .blog-lang-switcher-dropdown a.current { color:#1ab759; }
</style>
