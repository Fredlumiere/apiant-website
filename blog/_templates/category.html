<!DOCTYPE html>
<html lang="en">
<head>
{{HEAD}}
<!-- JSON-LD: CollectionPage + BreadcrumbList -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "CollectionPage",
  "name": {{JSON_CATEGORY_NAME}},
  "description": {{JSON_CATEGORY_DESCRIPTION}},
  "url": {{JSON_CATEGORY_URL}}
}
</script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "BreadcrumbList",
  "itemListElement": [
    { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://apiant.com/" },
    { "@type": "ListItem", "position": 2, "name": "Blog", "item": "https://apiant.com/blog/" },
    { "@type": "ListItem", "position": 3, "name": {{JSON_CATEGORY_NAME}}, "item": {{JSON_CATEGORY_URL}} }
  ]
}
</script>
</head>
<body class="blog-shell">
{{NAV}}

<section class="blog-hero">
  <div class="blog-container">
    <div class="blog-hero-eyebrow">CATEGORY · {{CATEGORY_NAME_UPPER}}</div>
    <h1 class="blog-hero-title">{{CATEGORY_NAME}}</h1>
    <p class="blog-hero-sub">{{CATEGORY_DESCRIPTION}}</p>
  </div>
</section>

<div class="blog-container">
  <div class="blog-search-row">
    <input id="blog-search-input" type="search" placeholder="Search posts..." autocomplete="off" aria-label="Search blog posts"/>
  </div>
  <div class="blog-filters">
    {{CATEGORY_PILLS}}
  </div>

  {{TAG_FILTER}}

  <section class="blog-grid">
    {{POST_CARDS}}
  </section>
</div>

{{FOOTER}}

<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js" defer></script>
<script src="/js/blog-search.js?v=20260606" defer></script>
<script src="/js/i18n.js" defer></script>
</body>
</html>
