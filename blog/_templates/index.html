<!DOCTYPE html>
<html lang="en">
<head>
{{HEAD}}
<!-- JSON-LD: Blog -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Blog",
  "name": "APIANT Blog",
  "description": "Use cases, customer stories, and platform deep dives from the APIANT integration platform.",
  "url": "https://apiant.com/blog/",
  "publisher": {
    "@type": "Organization",
    "name": "APIANT",
    "logo": {
      "@type": "ImageObject",
      "url": "https://apiant.com/images/APIANT-LOGO-V4-Dark-Mode.svg"
    }
  }
}
</script>
</head>
<body class="blog-shell">
{{NAV}}

<section class="blog-hero">
  <div class="blog-container">
    <div class="blog-hero-eyebrow">BUILDER NOTES</div>
    <h1 class="blog-hero-title">{{HERO_TITLE}}</h1>
    <p class="blog-hero-sub">{{HERO_SUB}}</p>
  </div>
</section>

<div class="blog-container">
  <div class="blog-search-row">
    <input id="blog-search-input" type="search" placeholder="Search posts..." autocomplete="off" aria-label="Search blog posts"/>
  </div>
  <div class="blog-filters">
    {{CATEGORY_PILLS}}
  </div>

  {{FEATURED_BLOCK}}

  <section class="blog-grid">
    {{POST_CARDS}}
  </section>
</div>

{{FOOTER}}

<script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js" defer></script>
<script src="/js/blog-search.js?v=20260606" defer></script>
<script src="/js/i18n.js" defer></script>
</body>
</html>
