# =============================================================================
# Apache Reverse Proxy: apiant.com -> Vercel (WHITELIST approach)
# =============================================================================
#
# SAFETY MODEL: Default routing is UNCHANGED. Only the explicit pages listed
# below are proxied to Vercel. Everything else (/editor, /admin-console,
# /oauth, /api, servlets, JSPs, and any path not listed here) continues to
# hit the origin server exactly as before.
#
# This is a whitelist, not a blacklist. If a page is not listed here,
# it is NOT proxied. No catch-all. No fallthrough.
#
# REQUIREMENTS:
#   sudo a2enmod proxy proxy_http headers ssl
#   sudo systemctl restart apache2
#
# INSTALLATION:
#   Include this file in your existing VirtualHost block:
#     Include /path/to/apache-vercel-proxy.conf
#
# =============================================================================


# Required modules: mod_proxy, mod_proxy_http, mod_headers, mod_ssl
<IfModule mod_proxy.c>

    SSLProxyEngine On
    ProxyPreserveHost Off
    ProxyRequests Off

    RequestHeader set X-Forwarded-Host "apiant.com"
    RequestHeader set X-Forwarded-Proto "https"

    Define VERCEL_BACKEND "https://apiant-website.vercel.app"


    # =========================================================================
    # STATIC ASSETS
    # =========================================================================
    # These directories contain only marketing site assets (stylesheets,
    # scripts, images, videos). The APIANT app (/editor, /admin-console, etc.)
    # uses its own asset paths and is not affected.
    # =========================================================================

    ProxyPass "/css/" "${VERCEL_BACKEND}/css/"
    ProxyPassReverse "/css/" "${VERCEL_BACKEND}/css/"

    ProxyPass "/js/" "${VERCEL_BACKEND}/js/"
    ProxyPassReverse "/js/" "${VERCEL_BACKEND}/js/"

    ProxyPass "/images/" "${VERCEL_BACKEND}/images/"
    ProxyPassReverse "/images/" "${VERCEL_BACKEND}/images/"

    ProxyPass "/videos/" "${VERCEL_BACKEND}/videos/"
    ProxyPassReverse "/videos/" "${VERCEL_BACKEND}/videos/"

    ProxyPass "/fonts/" "${VERCEL_BACKEND}/fonts/"
    ProxyPassReverse "/fonts/" "${VERCEL_BACKEND}/fonts/"


    # =========================================================================
    # HOMEPAGE
    # =========================================================================

    ProxyPass "/index.html" "${VERCEL_BACKEND}/index.html"
    ProxyPassReverse "/index.html" "${VERCEL_BACKEND}/index.html"


    # =========================================================================
    # AUDIENCE PAGES
    # =========================================================================

    ProxyPass "/for-saas.html" "${VERCEL_BACKEND}/for-saas.html"
    ProxyPassReverse "/for-saas.html" "${VERCEL_BACKEND}/for-saas.html"

    ProxyPass "/for-si.html" "${VERCEL_BACKEND}/for-si.html"
    ProxyPassReverse "/for-si.html" "${VERCEL_BACKEND}/for-si.html"

    ProxyPass "/for-enterprises.html" "${VERCEL_BACKEND}/for-enterprises.html"
    ProxyPassReverse "/for-enterprises.html" "${VERCEL_BACKEND}/for-enterprises.html"


    # =========================================================================
    # FEATURE PAGES
    # =========================================================================

    ProxyPass "/ai.html" "${VERCEL_BACKEND}/ai.html"
    ProxyPassReverse "/ai.html" "${VERCEL_BACKEND}/ai.html"

    ProxyPass "/chatbot.html" "${VERCEL_BACKEND}/chatbot.html"
    ProxyPassReverse "/chatbot.html" "${VERCEL_BACKEND}/chatbot.html"

    ProxyPass "/formapps.html" "${VERCEL_BACKEND}/formapps.html"
    ProxyPassReverse "/formapps.html" "${VERCEL_BACKEND}/formapps.html"

    ProxyPass "/mcp-servers.html" "${VERCEL_BACKEND}/mcp-servers.html"
    ProxyPassReverse "/mcp-servers.html" "${VERCEL_BACKEND}/mcp-servers.html"

    ProxyPass "/apps.html" "${VERCEL_BACKEND}/apps.html"
    ProxyPassReverse "/apps.html" "${VERCEL_BACKEND}/apps.html"

    ProxyPass "/pricing.html" "${VERCEL_BACKEND}/pricing.html"
    ProxyPassReverse "/pricing.html" "${VERCEL_BACKEND}/pricing.html"


    # =========================================================================
    # PLATFORM PAGES (explicit paths only, NOT the whole /platform/ directory)
    # =========================================================================

    ProxyPass "/platform/index.html" "${VERCEL_BACKEND}/platform/index.html"
    ProxyPassReverse "/platform/index.html" "${VERCEL_BACKEND}/platform/index.html"

    ProxyPass "/platform/automation-editor.html" "${VERCEL_BACKEND}/platform/automation-editor.html"
    ProxyPassReverse "/platform/automation-editor.html" "${VERCEL_BACKEND}/platform/automation-editor.html"

    ProxyPass "/platform/assembly-editor.html" "${VERCEL_BACKEND}/platform/assembly-editor.html"
    ProxyPassReverse "/platform/assembly-editor.html" "${VERCEL_BACKEND}/platform/assembly-editor.html"

    ProxyPass "/platform/admin-console.html" "${VERCEL_BACKEND}/platform/admin-console.html"
    ProxyPassReverse "/platform/admin-console.html" "${VERCEL_BACKEND}/platform/admin-console.html"


    # =========================================================================
    # API PARTNERS: Hub Pages
    # =========================================================================

    ProxyPass "/apipartners/mindbody-turnkey-integration-solutions.html" "${VERCEL_BACKEND}/apipartners/mindbody-turnkey-integration-solutions.html"
    ProxyPassReverse "/apipartners/mindbody-turnkey-integration-solutions.html" "${VERCEL_BACKEND}/apipartners/mindbody-turnkey-integration-solutions.html"

    ProxyPass "/apipartners/cliniko-turnkey-integration-solutions.html" "${VERCEL_BACKEND}/apipartners/cliniko-turnkey-integration-solutions.html"
    ProxyPassReverse "/apipartners/cliniko-turnkey-integration-solutions.html" "${VERCEL_BACKEND}/apipartners/cliniko-turnkey-integration-solutions.html"

    ProxyPass "/apipartners/donorperfect-turnkey-integration-solutions.html" "${VERCEL_BACKEND}/apipartners/donorperfect-turnkey-integration-solutions.html"
    ProxyPassReverse "/apipartners/donorperfect-turnkey-integration-solutions.html" "${VERCEL_BACKEND}/apipartners/donorperfect-turnkey-integration-solutions.html"


    # =========================================================================
    # API PARTNERS: Mindbody Product Pages (10)
    # =========================================================================

    ProxyPass "/apipartners/mindbody/mindbody-hubspot-integration-and-automation-apiant.html" "${VERCEL_BACKEND}/apipartners/mindbody/mindbody-hubspot-integration-and-automation-apiant.html"
    ProxyPassReverse "/apipartners/mindbody/mindbody-hubspot-integration-and-automation-apiant.html" "${VERCEL_BACKEND}/apipartners/mindbody/mindbody-hubspot-integration-and-automation-apiant.html"

    ProxyPass "/apipartners/mindbody/mindbody-activecampaign-integration-and-automation-apiant.html" "${VERCEL_BACKEND}/apipartners/mindbody/mindbody-activecampaign-integration-and-automation-apiant.html"
    ProxyPassReverse "/apipartners/mindbody/mindbody-activecampaign-integration-and-automation-apiant.html" "${VERCEL_BACKEND}/apipartners/mindbody/mindbody-activecampaign-integration-and-automation-apiant.html"

    ProxyPass "/apipartners/mindbody/mindbody-keap-integration-and-automation-apiant.html" "${VERCEL_BACKEND}/apipartners/mindbody/mindbody-keap-integration-and-automation-apiant.html"
    ProxyPassReverse "/apipartners/mindbody/mindbody-keap-integration-and-automation-apiant.html" "${VERCEL_BACKEND}/apipartners/mindbody/mindbody-keap-integration-and-automation-apiant.html"

    ProxyPass "/apipartners/mindbody/mindbody-klaviyo-integration-and-automation-apiant.html" "${VERCEL_BACKEND}/apipartners/mindbody/mindbody-klaviyo-integration-and-automation-apiant.html"
    ProxyPassReverse "/apipartners/mindbody/mindbody-klaviyo-integration-and-automation-apiant.html" "${VERCEL_BACKEND}/apipartners/mindbody/mindbody-klaviyo-integration-and-automation-apiant.html"

    ProxyPass "/apipartners/mindbody/mindbody-shopify-integration-and-automation-apiant.html" "${VERCEL_BACKEND}/apipartners/mindbody/mindbody-shopify-integration-and-automation-apiant.html"
    ProxyPassReverse "/apipartners/mindbody/mindbody-shopify-integration-and-automation-apiant.html" "${VERCEL_BACKEND}/apipartners/mindbody/mindbody-shopify-integration-and-automation-apiant.html"

    ProxyPass "/apipartners/mindbody/mindbody-zoho-crm-integration-and-automation-apiant.html" "${VERCEL_BACKEND}/apipartners/mindbody/mindbody-zoho-crm-integration-and-automation-apiant.html"
    ProxyPassReverse "/apipartners/mindbody/mindbody-zoho-crm-integration-and-automation-apiant.html" "${VERCEL_BACKEND}/apipartners/mindbody/mindbody-zoho-crm-integration-and-automation-apiant.html"

    ProxyPass "/apipartners/mindbody/mindbody-calendly-integration-and-automation-apiant.html" "${VERCEL_BACKEND}/apipartners/mindbody/mindbody-calendly-integration-and-automation-apiant.html"
    ProxyPassReverse "/apipartners/mindbody/mindbody-calendly-integration-and-automation-apiant.html" "${VERCEL_BACKEND}/apipartners/mindbody/mindbody-calendly-integration-and-automation-apiant.html"

    ProxyPass "/apipartners/mindbody/mindbody-highlevel-integration-and-automation-apiant.html" "${VERCEL_BACKEND}/apipartners/mindbody/mindbody-highlevel-integration-and-automation-apiant.html"
    ProxyPassReverse "/apipartners/mindbody/mindbody-highlevel-integration-and-automation-apiant.html" "${VERCEL_BACKEND}/apipartners/mindbody/mindbody-highlevel-integration-and-automation-apiant.html"

    ProxyPass "/apipartners/mindbody/mindbody-zapier-integration-and-automation-apiant.html" "${VERCEL_BACKEND}/apipartners/mindbody/mindbody-zapier-integration-and-automation-apiant.html"
    ProxyPassReverse "/apipartners/mindbody/mindbody-zapier-integration-and-automation-apiant.html" "${VERCEL_BACKEND}/apipartners/mindbody/mindbody-zapier-integration-and-automation-apiant.html"

    ProxyPass "/apipartners/mindbody/mindbody-zoom-integration-and-automation-apiant.html" "${VERCEL_BACKEND}/apipartners/mindbody/mindbody-zoom-integration-and-automation-apiant.html"
    ProxyPassReverse "/apipartners/mindbody/mindbody-zoom-integration-and-automation-apiant.html" "${VERCEL_BACKEND}/apipartners/mindbody/mindbody-zoom-integration-and-automation-apiant.html"


    # =========================================================================
    # API PARTNERS: Cliniko Product Pages (3)
    # =========================================================================

    ProxyPass "/apipartners/cliniko/cliniko-hubspot-integration-automation-apiant.html" "${VERCEL_BACKEND}/apipartners/cliniko/cliniko-hubspot-integration-automation-apiant.html"
    ProxyPassReverse "/apipartners/cliniko/cliniko-hubspot-integration-automation-apiant.html" "${VERCEL_BACKEND}/apipartners/cliniko/cliniko-hubspot-integration-automation-apiant.html"

    ProxyPass "/apipartners/cliniko/cliniko-activecampaign-integration-and-automation-apiant.html" "${VERCEL_BACKEND}/apipartners/cliniko/cliniko-activecampaign-integration-and-automation-apiant.html"
    ProxyPassReverse "/apipartners/cliniko/cliniko-activecampaign-integration-and-automation-apiant.html" "${VERCEL_BACKEND}/apipartners/cliniko/cliniko-activecampaign-integration-and-automation-apiant.html"

    ProxyPass "/apipartners/cliniko/cliniko-salesforce-integration-and-automation-apiant.html" "${VERCEL_BACKEND}/apipartners/cliniko/cliniko-salesforce-integration-and-automation-apiant.html"
    ProxyPassReverse "/apipartners/cliniko/cliniko-salesforce-integration-and-automation-apiant.html" "${VERCEL_BACKEND}/apipartners/cliniko/cliniko-salesforce-integration-and-automation-apiant.html"


    # =========================================================================
    # API PARTNERS: DonorPerfect Product Pages (4)
    # =========================================================================

    ProxyPass "/apipartners/donorperfect/donorperfect-hubspot-integration-and-automation-apiant.html" "${VERCEL_BACKEND}/apipartners/donorperfect/donorperfect-hubspot-integration-and-automation-apiant.html"
    ProxyPassReverse "/apipartners/donorperfect/donorperfect-hubspot-integration-and-automation-apiant.html" "${VERCEL_BACKEND}/apipartners/donorperfect/donorperfect-hubspot-integration-and-automation-apiant.html"

    ProxyPass "/apipartners/donorperfect/donorperfect-activecampaign-integration-and-automation-apiant.html" "${VERCEL_BACKEND}/apipartners/donorperfect/donorperfect-activecampaign-integration-and-automation-apiant.html"
    ProxyPassReverse "/apipartners/donorperfect/donorperfect-activecampaign-integration-and-automation-apiant.html" "${VERCEL_BACKEND}/apipartners/donorperfect/donorperfect-activecampaign-integration-and-automation-apiant.html"

    ProxyPass "/apipartners/donorperfect/donorperfect-keap-integration-and-automation-apiant.html" "${VERCEL_BACKEND}/apipartners/donorperfect/donorperfect-keap-integration-and-automation-apiant.html"
    ProxyPassReverse "/apipartners/donorperfect/donorperfect-keap-integration-and-automation-apiant.html" "${VERCEL_BACKEND}/apipartners/donorperfect/donorperfect-keap-integration-and-automation-apiant.html"

    ProxyPass "/apipartners/donorperfect/donorperfect-mailchimp-integration-and-automation-apiant.html" "${VERCEL_BACKEND}/apipartners/donorperfect/donorperfect-mailchimp-integration-and-automation-apiant.html"
    ProxyPassReverse "/apipartners/donorperfect/donorperfect-mailchimp-integration-and-automation-apiant.html" "${VERCEL_BACKEND}/apipartners/donorperfect/donorperfect-mailchimp-integration-and-automation-apiant.html"


    # =========================================================================
    # LEGAL PAGES
    # =========================================================================

    ProxyPass "/privacy.html" "${VERCEL_BACKEND}/privacy.html"
    ProxyPassReverse "/privacy.html" "${VERCEL_BACKEND}/privacy.html"

    ProxyPass "/cookie-policy.html" "${VERCEL_BACKEND}/cookie-policy.html"
    ProxyPassReverse "/cookie-policy.html" "${VERCEL_BACKEND}/cookie-policy.html"

    ProxyPass "/tos.html" "${VERCEL_BACKEND}/tos.html"
    ProxyPassReverse "/tos.html" "${VERCEL_BACKEND}/tos.html"


    # =========================================================================
    # ERROR PAGES
    # =========================================================================

    ProxyPass "/401.html" "${VERCEL_BACKEND}/401.html"
    ProxyPassReverse "/401.html" "${VERCEL_BACKEND}/401.html"

    ProxyPass "/404.html" "${VERCEL_BACKEND}/404.html"
    ProxyPassReverse "/404.html" "${VERCEL_BACKEND}/404.html"


    # =========================================================================
    # POST-SIGNUP PAGES
    # =========================================================================

    ProxyPass "/appconnect-next-steps.html" "${VERCEL_BACKEND}/appconnect-next-steps.html"
    ProxyPassReverse "/appconnect-next-steps.html" "${VERCEL_BACKEND}/appconnect-next-steps.html"

    ProxyPass "/shopconnect-next-steps.html" "${VERCEL_BACKEND}/shopconnect-next-steps.html"
    ProxyPassReverse "/shopconnect-next-steps.html" "${VERCEL_BACKEND}/shopconnect-next-steps.html"

    ProxyPass "/mailconnect-next-steps.html" "${VERCEL_BACKEND}/mailconnect-next-steps.html"
    ProxyPassReverse "/mailconnect-next-steps.html" "${VERCEL_BACKEND}/mailconnect-next-steps.html"

    ProxyPass "/zoomconnect-nextsteps.html" "${VERCEL_BACKEND}/zoomconnect-nextsteps.html"
    ProxyPassReverse "/zoomconnect-nextsteps.html" "${VERCEL_BACKEND}/zoomconnect-nextsteps.html"


    # =========================================================================
    # CONNECT PAGES (static versions only)
    # The servlet templates (servlettemplateconnect.html,
    # servlettemplateconnections.html) are NOT listed here, so they
    # continue to be handled by the origin server's backend.
    # =========================================================================

    ProxyPass "/connect/connect.html" "${VERCEL_BACKEND}/connect/connect.html"
    ProxyPassReverse "/connect/connect.html" "${VERCEL_BACKEND}/connect/connect.html"

    ProxyPass "/connections/connections.html" "${VERCEL_BACKEND}/connections/connections.html"
    ProxyPassReverse "/connections/connections.html" "${VERCEL_BACKEND}/connections/connections.html"


    # =========================================================================
    # NO CATCH-ALL. That's the point.
    #
    # Everything not listed above (including /editor, /admin-console, /oauth,
    # /api, /servlet, /jsp*, /dashboard, /login, /register, and any other
    # application paths) passes through to the origin server unchanged.
    # =========================================================================

</IfModule>


# =============================================================================
# CACHING (optional)
# =============================================================================

<IfModule mod_headers.c>
    # Cache proxied static assets for 1 day
    <LocationMatch "^/(css|js|images|videos|fonts)/">
        Header set Cache-Control "public, max-age=86400"
    </LocationMatch>

    # No cache for proxied HTML pages (always fresh from Vercel)
    <LocationMatch "\.html$">
        Header set Cache-Control "no-cache, must-revalidate"
    </LocationMatch>
</IfModule>


# =============================================================================
# HOMEPAGE ROOT PATH
# =============================================================================
# If apiant.com/ (without index.html) should also serve the Vercel homepage,
# add this RewriteRule inside your VirtualHost (requires mod_rewrite):
#
#   RewriteEngine On
#   RewriteRule ^/?$ /index.html [PT]
#
# This internally rewrites "/" to "/index.html", which then hits the
# ProxyPass rule above. Only add this if the origin server doesn't already
# handle "/" with its own logic.
# =============================================================================
