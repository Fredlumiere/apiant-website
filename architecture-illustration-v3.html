<!-- APIANT Architecture: 3D Rotating Grid with Multi-Node AI Scan -->
<div class="arch-3d-wrap" style="width:100%;max-width:900px;margin:0 auto;perspective:1200px;overflow:hidden;">
<style>
  .arch-3d-plane {
    transform-style: preserve-3d;
    animation: archRotate 20s ease-in-out infinite;
  }
  @keyframes archRotate {
    0% { transform: rotateX(55deg) rotateZ(-5deg); }
    25% { transform: rotateX(52deg) rotateZ(8deg); }
    50% { transform: rotateX(58deg) rotateZ(-3deg); }
    75% { transform: rotateX(50deg) rotateZ(6deg); }
    100% { transform: rotateX(55deg) rotateZ(-5deg); }
  }
  .arch-3d-svg { width: 100%; height: auto; }

  /* Grid lines */
  .g-line { stroke: rgba(255,255,255,0.06); stroke-width: 0.5; }
  .g-line-v { stroke: rgba(255,255,255,0.04); stroke-width: 0.4; }

  /* Connection lines between nodes */
  .c-line { stroke: rgba(26,183,89,0.12); stroke-width: 0.8; fill: none; }
  .c-line-glow { stroke: rgba(26,183,89,0); stroke-width: 1.5; fill: none; filter: url(#ag); animation: cGlow 12s ease infinite; }

  /* Nodes */
  .nd { fill: rgba(26,183,89,0.2); stroke: rgba(26,183,89,0.45); stroke-width: 1; transition: all 0.5s; }
  .nd-dim { fill: rgba(26,183,89,0.08); stroke: rgba(26,183,89,0.15); stroke-width: 0.6; }
  .nd-bright { fill: rgba(26,183,89,0.35); stroke: rgba(26,183,89,0.7); stroke-width: 1.2; }

  /* Pulse rings on all nodes */
  .nd, .nd-dim, .nd-bright { animation: ndPulse 12s ease infinite; }

  /* Target nodes (the 3 that get found) */
  .nd-t1 { animation: target1 12s ease infinite; }
  .nd-t2 { animation: target2 12s ease infinite; }
  .nd-t3 { animation: target3 12s ease infinite; }

  /* Scan beam sweeping across the plane */
  .scan-beam { animation: scanSweep 12s ease infinite; }

  /* Fix pulses */
  .fix-ring { fill: none; stroke: #1ab759; stroke-width: 2; opacity: 0; }
  .fix-r1 { animation: fixR 12s ease infinite; }
  .fix-r2 { animation: fixR 12s ease 0.3s infinite; }
  .fix-r3 { animation: fixR 12s ease 0.6s infinite; }

  /* Crosshairs */
  .xh { stroke: #ef4444; stroke-width: 1; opacity: 0; }
  .xh1 { animation: xhShow 12s ease infinite; }
  .xh2 { animation: xhShow 12s ease 0.15s infinite; }
  .xh3 { animation: xhShow 12s ease 0.3s infinite; }

  /* Success check */
  .arch-check { stroke: #1ab759; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 30; stroke-dashoffset: 30; animation: archCheckDraw 12s ease infinite; }

  @keyframes cGlow {
    0%,5% { stroke: rgba(26,183,89,0); }
    10%,20% { stroke: rgba(26,183,89,0.25); }
    25%,50% { stroke: rgba(26,183,89,0.06); }
    70%,85% { stroke: rgba(26,183,89,0.3); }
    95%,100% { stroke: rgba(26,183,89,0); }
  }

  @keyframes ndPulse {
    0%,8% { opacity: 0.5; }
    12%,20% { opacity: 1; }
    25%,45% { opacity: 0.3; }
    65%,85% { opacity: 1; }
    95%,100% { opacity: 0.5; }
  }

  /* Target 1: top-left area */
  @keyframes target1 {
    0%,22% { fill: rgba(26,183,89,0.2); stroke: rgba(26,183,89,0.45); }
    28%,32% { fill: rgba(239,68,68,0.35); stroke: rgba(239,68,68,0.8); }
    38%,45% { fill: rgba(239,68,68,0.4); stroke: rgba(239,68,68,0.9); }
    52%,56% { fill: rgba(255,255,255,0.5); stroke: #fff; }
    62%,85% { fill: rgba(26,183,89,0.4); stroke: rgba(26,183,89,0.9); }
    95%,100% { fill: rgba(26,183,89,0.2); stroke: rgba(26,183,89,0.45); }
  }
  /* Target 2: center-right */
  @keyframes target2 {
    0%,26% { fill: rgba(26,183,89,0.2); stroke: rgba(26,183,89,0.45); }
    32%,36% { fill: rgba(239,68,68,0.35); stroke: rgba(239,68,68,0.8); }
    42%,48% { fill: rgba(239,68,68,0.4); stroke: rgba(239,68,68,0.9); }
    55%,59% { fill: rgba(255,255,255,0.5); stroke: #fff; }
    65%,85% { fill: rgba(26,183,89,0.4); stroke: rgba(26,183,89,0.9); }
    95%,100% { fill: rgba(26,183,89,0.2); stroke: rgba(26,183,89,0.45); }
  }
  /* Target 3: bottom area */
  @keyframes target3 {
    0%,30% { fill: rgba(26,183,89,0.2); stroke: rgba(26,183,89,0.45); }
    36%,40% { fill: rgba(239,68,68,0.35); stroke: rgba(239,68,68,0.8); }
    46%,52% { fill: rgba(239,68,68,0.4); stroke: rgba(239,68,68,0.9); }
    58%,62% { fill: rgba(255,255,255,0.5); stroke: #fff; }
    68%,85% { fill: rgba(26,183,89,0.4); stroke: rgba(26,183,89,0.9); }
    95%,100% { fill: rgba(26,183,89,0.2); stroke: rgba(26,183,89,0.45); }
  }

  @keyframes scanSweep {
    0%,15% { opacity: 0; }
    18% { opacity: 0.6; x: -100; }
    22% { x: 100; opacity: 0.8; }
    28% { x: 350; opacity: 0.7; }
    35% { x: 600; opacity: 0.5; }
    40% { x: 800; opacity: 0; }
    100% { opacity: 0; }
  }

  @keyframes xhShow {
    0%,28% { opacity: 0; }
    35% { opacity: 0.9; }
    52% { opacity: 0.8; }
    58% { opacity: 0; }
    100% { opacity: 0; }
  }

  @keyframes fixR {
    0%,55% { opacity: 0; r: 4; }
    60% { opacity: 0.7; r: 6; }
    65% { opacity: 0.5; r: 20; }
    72% { opacity: 0.2; r: 40; }
    78% { opacity: 0; r: 55; }
    100% { opacity: 0; }
  }

  @keyframes archCheckDraw {
    0%,72% { stroke-dashoffset: 30; opacity: 0; }
    76% { opacity: 1; stroke-dashoffset: 30; }
    86% { stroke-dashoffset: 0; opacity: 1; }
    92% { opacity: 1; }
    97%,100% { opacity: 0; }
  }
</style>
<div class="arch-3d-plane">
<svg class="arch-3d-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" aria-label="3D rotating integration grid with AI scanning multiple nodes">

</g>
