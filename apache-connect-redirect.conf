# =============================================================================
# Redirect legacy apiant.com /connect/ and /connections/ pages to apiant.ai
# =============================================================================
#
# WHY THIS IS AN ALLOWLIST AND NOT A DOMAIN SWAP
#
# apiant.com's sitemap carries 39,006 /connect/<A>-to-<B> pages and 198
# /connections/<A> pages. The connect set is exactly the cross-product of one
# 198-app catalog (198 x 197 = 39,006).
#
# apiant.ai runs a different, newer catalog of 663 apps, and only 59 of the
# legacy 198 exist in it. Dropbox, PayPal, Zendesk, Zoho CRM, Box, AWeber,
# Eventbrite, Square, Marketo, WooCommerce, the Amazon services and the
# Transform-* / Webhook / HTTP system apps are all absent. Swapping the domain
# on everything would therefore 301 about 36,000 URLs straight into a 404.
#
# Two further constraints, both measured rather than assumed:
#   - Having both apps on apiant.ai is not sufficient. A pair page exists only
#     if the left app exposes a trigger there and the right app exposes an
#     action. Five of the 59 have no trigger (anthropic, geckoboard, geonames,
#     ip2location, pushover) and one has no action (picreel).
#   - Legacy URLs are mixed case (/connect/Stripe-to-Ontraport). apiant.ai
#     serves lowercase and 301s mixed case down to lowercase itself, so we
#     lowercase here to give visitors and crawlers one hop instead of two.
#
# Net: 54 sources x 58 targets, less 53 self-pairs, = 3,079 redirectable
# /connect/ pages plus 59 /connections/ pages. Verified 2026-09-16 by probing
# all 3,422 candidate pairs against apiant.ai; the two capability lists below
# reproduce the 3,079 live pages exactly, with no false positives and no false
# negatives. Everything else falls through and keeps serving from apiant.com.
#
# Every app later added to apiant.ai converts roughly another 110 legacy pairs,
# so re-run the probe and regenerate the maps periodically:
#   python3 scripts/probe_apiant_ai_catalog.py
#
# REQUIREMENTS: mod_rewrite. The three map files must be readable by the
# Apache user. At this size plain txt maps are fine; if the lookup ever shows
# up in a profile, convert them with httxt2dbm and change txt: to dbm:.
#
# INSTALL
#   sudo cp apiant-ai-apps.txt apiant-ai-connect-sources.txt \
#           apiant-ai-connect-targets.txt /etc/apache2/
#   sudo cp apache-connect-redirect.conf /etc/apache2/conf-available/
#
#   Add ONE line inside the apiant.com <VirtualHost *:443> block, positioned
#   BEFORE any ProxyPass, JkMount or servlet mapping that sends /connect/ to
#   the application server:
#
#     Include /etc/apache2/conf-available/apache-connect-redirect.conf
#
#   sudo apachectl configtest && sudo systemctl reload apache2
#
#   ORDERING CAVEAT, verify this on the box. mod_proxy's ProxyPass is handled
#   in the same request phase as mod_rewrite and commonly wins. If /connect/
#   currently reaches the application server through a ProxyPass or JkMount,
#   confirm after reload that the redirect actually fires (see VERIFY). If it
#   does not, either move these rules above the proxy directives or issue the
#   redirect from the servlet instead.
#
# ROLLOUT. R=302 is written below on purpose. A 301 is cached hard by browsers
# and is painful to undo. Ship on 302, confirm the targets and the analytics
# look right for a few days, then change R=302 to R=301 in both rules.
#
# VERIFY
#   # redirects (trigger on the left, action on the right)
#   curl -sI https://apiant.com/connect/Stripe-to-Ontraport | head -3
#   # does not redirect (Dropbox is not on apiant.ai)
#   curl -sI https://apiant.com/connect/HTML-to-Dropbox | head -3
#   # does not redirect (Anthropic has no trigger on apiant.ai)
#   curl -sI https://apiant.com/connect/Anthropic-to-Slack | head -3
#   # does not redirect (Picreel has no action on apiant.ai)
#   curl -sI https://apiant.com/connect/Slack-to-Picreel | head -3
#   # single-app pages
#   curl -sI https://apiant.com/connections/Mailchimp | head -3   # redirects
#   curl -sI https://apiant.com/connections/PayPal | head -3      # does not
# =============================================================================

<IfModule mod_rewrite.c>

    RewriteEngine On

    # Lookup maps. A miss returns the fallback "-", which the conditions test.
    RewriteMap aisrc "txt:/etc/apache2/apiant-ai-connect-sources.txt"
    RewriteMap aidst "txt:/etc/apache2/apiant-ai-connect-targets.txt"
    RewriteMap aiapp "txt:/etc/apache2/apiant-ai-apps.txt"

    # Apache's built-in lowercasing map.
    RewriteMap lc int:tolower

    # ---------------------------------------------------------------------
    # /connect/<A>-to-<B>
    # ---------------------------------------------------------------------
    # The greedy split on "-to-" is unambiguous: no name in the legacy
    # 198-app catalog contains "-to-", ends in "-to" or starts with "to-"
    # (checked against the full list on 2026-09-16). App names that do carry
    # hyphens, such as Agile-CRM and QuickBooks-Online, split correctly.
    RewriteCond ${aisrc:${lc:$1}|-} !=-
    RewriteCond ${aidst:${lc:$2}|-} !=-
    RewriteRule ^/?connect/(.+)-to-(.+)$ \
        https://apiant.ai/connect/${aisrc:${lc:$1}}-to-${aidst:${lc:$2}} [R=302,L,NE]

    # ---------------------------------------------------------------------
    # /connections/<A>
    # ---------------------------------------------------------------------
    # Any app present on apiant.ai qualifies here; a single-app page needs no
    # trigger or action. connect.html, connections.html and the
    # servletTemplate*.html files are not in the map, so they are untouched.
    RewriteCond ${aiapp:${lc:$1}|-} !=-
    RewriteRule ^/?connections/([^/]+)/?$ \
        https://apiant.ai/connections/${aiapp:${lc:$1}} [R=302,L,NE]

</IfModule>
