# blog-redirect.conf
# 301-redirects the retired HubSpot blog (blog.apiant.com) to the new blog
# at apiant.com/blog. Slugs are preserved 1:1, so old post URLs land on the
# exact new post and keep their SEO equity.
#
#   /en/<slug>            -> https://apiant.com/blog/posts/<slug>/
#   /en/tag|author|page/* -> https://apiant.com/blog/   (taxonomy/pagination)
#   everything else       -> https://apiant.com/blog/
#
# Deploy: put blog.apiant.com on this Apache host (Route 53 + TLS cert),
# then Include this file from the server config and reload Apache.
# Full steps: see BLOG-REDIRECT-SETUP.md. Requires mod_rewrite + mod_ssl.

<VirtualHost *:80>
    ServerName blog.apiant.com
    RewriteEngine On
    # Send http to https on the same host so the rules below still map slugs.
    RewriteRule ^ https://blog.apiant.com%{REQUEST_URI} [R=301,L]
</VirtualHost>

<VirtualHost *:443>
    ServerName blog.apiant.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/blog.apiant.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/blog.apiant.com/privkey.pem

    RewriteEngine On

    # Taxonomy, author, and pagination pages -> new blog index.
    RewriteRule ^/en/(tag|author|page)(/.*)?$ https://apiant.com/blog/ [R=301,L]

    # Individual posts: /en/<slug> -> /blog/posts/<slug>/
    RewriteRule ^/en/([^/]+)/?$ https://apiant.com/blog/posts/$1/ [R=301,L]

    # Blog home and anything else (incl. legacy draft UUID URLs) -> index.
    RewriteRule ^ https://apiant.com/blog/ [R=301,L]
</VirtualHost>
