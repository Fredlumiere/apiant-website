<!-- APIANT Architecture Illustration - Structured Data Tree with AI Diagnosis Animation -->
<div style="width:100%;max-width:800px;margin:0 auto;">
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" style="width:100%;height:auto;max-height:400px;" aria-label="Animated diagram showing AI diagnosing and repairing a node in a structured data tree">
<style>
  /* ============================================================
     PHASE TIMING (9s total loop)
     Phase 1: 0s-2s     Data flowing through tree (green pulses)
     Phase 2: 2s-4s     AI scan, node 5 turns red
     Phase 3: 4s-6s     Surgical edit, red -> green
     Phase 4: 6s-8s     Replay from step 5 forward
     Phase 5: 8s-9s     All green, checkmark
     ============================================================

     NODE POSITIONS:
     N1: 300, 44    (root)
     N2: 180, 134   (left)
     N3: 420, 134   (right)
     N4: 100, 230   (left-left)
     N5: 300, 230   (left-right) ** PROBLEM **
     N6: 380, 230   (right-left)
     N7: 500, 230   (right-right)
     N8: 300, 326   (child of N5)
     ============================================================ */

  /* === PARTICLES: traveling dots along paths === */
  .particle {
    fill: #1ab759;
    filter: url(#particleGlow);
  }

  /* Phase 1 particle motion using offset-path */
  .p1 { offset-path: path('M300,44 L180,134'); }
  .p2 { offset-path: path('M300,44 L420,134'); }
  .p3 { offset-path: path('M180,134 L100,230'); }
  .p4 { offset-path: path('M180,134 L300,230'); }
  .p5 { offset-path: path('M420,134 L380,230'); }
  .p6 { offset-path: path('M420,134 L500,230'); }
  .p7 { offset-path: path('M300,230 L300,326'); }

  .p1 { animation: moveP1 9s linear infinite; }
  .p2 { animation: moveP2 9s linear infinite; }
  .p3 { animation: moveP3 9s linear infinite; }
  .p4 { animation: moveP4 9s linear infinite; }
  .p5 { animation: moveP5 9s linear infinite; }
  .p6 { animation: moveP6 9s linear infinite; }
  .p7 { animation: moveP7 9s linear infinite; }

  @keyframes moveP1 {
    0%   { offset-distance: 0%; opacity: 0; }
    1%   { opacity: 0.9; }
    8%   { offset-distance: 100%; opacity: 0.9; }
    10%  { opacity: 0; }
    100% { offset-distance: 100%; opacity: 0; }
  }
  @keyframes moveP2 {
    0%   { offset-distance: 0%; opacity: 0; }
    2%   { opacity: 0.9; }
    9%   { offset-distance: 100%; opacity: 0.9; }
    11%  { opacity: 0; }
    100% { offset-distance: 100%; opacity: 0; }
  }
  @keyframes moveP3 {
    0%   { offset-distance: 0%; opacity: 0; }
    8%   { offset-distance: 0%; opacity: 0; }
    9%   { opacity: 0.9; }
    16%  { offset-distance: 100%; opacity: 0.9; }
    18%  { opacity: 0; }
    100% { offset-distance: 100%; opacity: 0; }
  }
  @keyframes moveP4 {
    0%   { offset-distance: 0%; opacity: 0; }
    8%   { offset-distance: 0%; opacity: 0; }
    10%  { opacity: 0.9; }
    17%  { offset-distance: 100%; opacity: 0.9; }
    19%  { opacity: 0; }
    100% { offset-distance: 100%; opacity: 0; }
  }
  @keyframes moveP5 {
    0%   { offset-distance: 0%; opacity: 0; }
    9%   { offset-distance: 0%; opacity: 0; }
    10%  { opacity: 0.9; }
    17%  { offset-distance: 100%; opacity: 0.9; }
    19%  { opacity: 0; }
    100% { offset-distance: 100%; opacity: 0; }
  }
  @keyframes moveP6 {
    0%   { offset-distance: 0%; opacity: 0; }
    9%   { offset-distance: 0%; opacity: 0; }
    11%  { opacity: 0.9; }
    18%  { offset-distance: 100%; opacity: 0.9; }
    20%  { opacity: 0; }
    100% { offset-distance: 100%; opacity: 0; }
  }
  @keyframes moveP7 {
    0%   { offset-distance: 0%; opacity: 0; }
    17%  { offset-distance: 0%; opacity: 0; }
    18%  { opacity: 0.9; }
    22%  { offset-distance: 100%; opacity: 0.9; }
    24%  { opacity: 0; }
    100% { offset-distance: 100%; opacity: 0; }
  }

  /* Phase 4: replay particle N5 -> N8 */
  .p-replay {
    offset-path: path('M300,230 L300,326');
    animation: moveReplay 9s linear infinite;
  }
  @keyframes moveReplay {
    0%   { offset-distance: 0%; opacity: 0; }
    68%  { offset-distance: 0%; opacity: 0; }
    70%  { opacity: 0.9; }
    78%  { offset-distance: 100%; opacity: 0.9; }
    80%  { opacity: 0; }
    100% { offset-distance: 100%; opacity: 0; }
  }

  /* === LINES === */
  .tree-line {
    stroke: rgba(255,255,255,0.07);
    stroke-width: 1.5;
    fill: none;
  }

  /* Phase 1: lines glow green as particles pass */
  .line-glow-p1 {
    stroke: rgba(26,183,89,0);
    stroke-width: 2;
    fill: none;
    animation: lineGlowP1 9s ease infinite;
  }
  @keyframes lineGlowP1 {
    0%   { stroke: rgba(26,183,89,0); }
    3%   { stroke: rgba(26,183,89,0.2); }
    18%  { stroke: rgba(26,183,89,0.2); }
    22%  { stroke: rgba(26,183,89,0); }
    100% { stroke: rgba(26,183,89,0); }
  }

  /* Phase 4-5: all lines glow green (success state) */
  .line-glow-final {
    stroke: rgba(26,183,89,0);
    stroke-width: 2;
    fill: none;
    animation: lineGlowFinal 9s ease infinite;
  }
  @keyframes lineGlowFinal {
    0%   { stroke: rgba(26,183,89,0); }
    72%  { stroke: rgba(26,183,89,0); }
    78%  { stroke: rgba(26,183,89,0.2); }
    88%  { stroke: rgba(26,183,89,0.25); }
    94%  { stroke: rgba(26,183,89,0.1); }
    100% { stroke: rgba(26,183,89,0); }
  }

  /* Phase 4: N5-N8 replay line glow */
  .line-glow-replay {
    stroke: rgba(26,183,89,0);
    stroke-width: 2.5;
    fill: none;
    animation: lineGlowReplay 9s ease infinite;
  }
  @keyframes lineGlowReplay {
    0%   { stroke: rgba(26,183,89,0); }
    68%  { stroke: rgba(26,183,89,0); }
    72%  { stroke: rgba(26,183,89,0.35); }
    80%  { stroke: rgba(26,183,89,0.35); }
    84%  { stroke: rgba(26,183,89,0); }
    100% { stroke: rgba(26,183,89,0); }
  }

  /* Phase 2: lines near N5 go red */
  .line-problem-n2n5 {
    stroke: rgba(255,255,255,0.07);
    stroke-width: 1.5;
    fill: none;
    animation: lineProblemN2N5 9s ease infinite;
  }
  @keyframes lineProblemN2N5 {
    0%   { stroke: rgba(255,255,255,0.07); }
    36%  { stroke: rgba(255,255,255,0.07); }
    40%  { stroke: rgba(239,68,68,0.2); }
    44%  { stroke: rgba(239,68,68,0.25); }
    60%  { stroke: rgba(239,68,68,0.15); }
    66%  { stroke: rgba(255,255,255,0.07); }
    100% { stroke: rgba(255,255,255,0.07); }
  }
  .line-problem-n5n8 {
    stroke: rgba(255,255,255,0.07);
    stroke-width: 1.5;
    fill: none;
    animation: lineProblemN5N8 9s ease infinite;
  }
  @keyframes lineProblemN5N8 {
    0%   { stroke: rgba(255,255,255,0.07); }
    38%  { stroke: rgba(255,255,255,0.07); }
    42%  { stroke: rgba(239,68,68,0.15); }
    44%  { stroke: rgba(239,68,68,0.2); }
    62%  { stroke: rgba(239,68,68,0.1); }
    66%  { stroke: rgba(255,255,255,0.07); }
    100% { stroke: rgba(255,255,255,0.07); }
  }

  /* === NODES === */
  .node-base {
    fill: rgba(255,255,255,0.03);
    stroke: rgba(255,255,255,0.1);
    stroke-width: 1.5;
  }

  /* Normal nodes: green in P1, idle in P2-P3, green in P4-P5 */
  .node-normal {
    animation: nodeNormal 9s ease infinite;
  }
  @keyframes nodeNormal {
    0%   { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); }
    5%   { fill: rgba(26,183,89,0.06); stroke: rgba(26,183,89,0.3); }
    12%  { fill: rgba(26,183,89,0.12); stroke: rgba(26,183,89,0.45); }
    20%  { fill: rgba(26,183,89,0.05); stroke: rgba(26,183,89,0.2); }
    22%  { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); }
    66%  { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); }
    74%  { fill: rgba(26,183,89,0.1); stroke: rgba(26,183,89,0.4); }
    88%  { fill: rgba(26,183,89,0.14); stroke: rgba(26,183,89,0.5); }
    94%  { fill: rgba(26,183,89,0.06); stroke: rgba(26,183,89,0.25); }
    100% { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); }
  }
  .nd-1 { animation-delay: 0s; }
  .nd-2 { animation-delay: 0.15s; }
  .nd-3 { animation-delay: 0.15s; }
  .nd-4 { animation-delay: 0.3s; }
  .nd-6 { animation-delay: 0.3s; }
  .nd-7 { animation-delay: 0.3s; }

  /* Node 5: full problem lifecycle */
  .node-problem {
    animation: nodeProblem 9s ease infinite;
  }
  @keyframes nodeProblem {
    0%   { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); }
    7%   { fill: rgba(26,183,89,0.06); stroke: rgba(26,183,89,0.3); }
    14%  { fill: rgba(26,183,89,0.12); stroke: rgba(26,183,89,0.45); }
    20%  { fill: rgba(26,183,89,0.05); stroke: rgba(26,183,89,0.2); }
    22%  { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); }
    /* Phase 2: turn red */
    32%  { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); }
    38%  { fill: rgba(239,68,68,0.15); stroke: rgba(239,68,68,0.6); }
    44%  { fill: rgba(239,68,68,0.22); stroke: rgba(239,68,68,0.8); }
    /* Phase 3: flash + heal */
    48%  { fill: rgba(239,68,68,0.25); stroke: rgba(239,68,68,0.85); }
    52%  { fill: rgba(255,255,255,0.3); stroke: rgba(255,255,255,0.7); }
    56%  { fill: rgba(239,68,68,0.12); stroke: rgba(239,68,68,0.4); }
    60%  { fill: rgba(255,255,255,0.25); stroke: rgba(255,255,255,0.6); }
    64%  { fill: rgba(26,183,89,0.14); stroke: rgba(26,183,89,0.55); }
    /* Phase 4-5: healthy */
    72%  { fill: rgba(26,183,89,0.12); stroke: rgba(26,183,89,0.45); }
    88%  { fill: rgba(26,183,89,0.14); stroke: rgba(26,183,89,0.5); }
    94%  { fill: rgba(26,183,89,0.06); stroke: rgba(26,183,89,0.25); }
    100% { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); }
  }

  /* Node 5 red glow ring (expands during phase 2) */
  .problem-glow {
    fill: none;
    stroke: rgba(239,68,68,0.3);
    stroke-width: 2;
    opacity: 0;
    transform-origin: 300px 230px;
    animation: problemGlow 9s ease infinite;
  }
  @keyframes problemGlow {
    0%   { opacity: 0; transform: scale(1); }
    32%  { opacity: 0; transform: scale(1); }
    38%  { opacity: 0.5; transform: scale(1.5); }
    44%  { opacity: 0.7; transform: scale(1.9); }
    48%  { opacity: 0.6; transform: scale(2.1); }
    56%  { opacity: 0.2; transform: scale(1.4); }
    64%  { opacity: 0; transform: scale(1); }
    100% { opacity: 0; transform: scale(1); }
  }

  /* Node 8: downstream affected */
  .node-downstream {
    animation: nodeDownstream 9s ease infinite;
  }
  @keyframes nodeDownstream {
    0%   { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); }
    9%   { fill: rgba(26,183,89,0.06); stroke: rgba(26,183,89,0.3); }
    16%  { fill: rgba(26,183,89,0.12); stroke: rgba(26,183,89,0.45); }
    21%  { fill: rgba(26,183,89,0.05); stroke: rgba(26,183,89,0.2); }
    23%  { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); }
    /* Phase 2: faint red */
    40%  { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); }
    44%  { fill: rgba(239,68,68,0.07); stroke: rgba(239,68,68,0.25); }
    48%  { fill: rgba(239,68,68,0.1); stroke: rgba(239,68,68,0.3); }
    /* Phase 3: heal */
    60%  { fill: rgba(239,68,68,0.05); stroke: rgba(239,68,68,0.15); }
    66%  { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); }
    /* Phase 4: replay */
    74%  { fill: rgba(26,183,89,0.1); stroke: rgba(26,183,89,0.4); }
    80%  { fill: rgba(26,183,89,0.14); stroke: rgba(26,183,89,0.5); }
    88%  { fill: rgba(26,183,89,0.14); stroke: rgba(26,183,89,0.5); }
    94%  { fill: rgba(26,183,89,0.06); stroke: rgba(26,183,89,0.25); }
    100% { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.1); }
  }

  /* === AI SCAN BEAM (Phase 2) === */
  .scan-beam {
    opacity: 0;
    animation: scanSweep 9s ease-in-out infinite;
  }
  @keyframes scanSweep {
    0%   { opacity: 0; transform: translateY(0); }
    22%  { opacity: 0; transform: translateY(-160px); }
    24%  { opacity: 1; transform: translateY(-160px); }
    36%  { transform: translateY(140px); }
    38%  { opacity: 1; }
    40%  { opacity: 0; }
    100% { opacity: 0; transform: translateY(140px); }
  }

  /* === CROSSHAIR (Phase 3) === */
  .crosshair {
    opacity: 0;
    animation: crosshairShow 9s ease infinite;
  }
  @keyframes crosshairShow {
    0%   { opacity: 0; }
    46%  { opacity: 0; }
    50%  { opacity: 1; }
    58%  { opacity: 1; }
    62%  { opacity: 0.4; }
    66%  { opacity: 0; }
    100% { opacity: 0; }
  }

  .crosshair-ring {
    transform-origin: 300px 230px;
    animation: ringRotate 4s linear infinite;
    stroke-dasharray: 6 4;
  }
  @keyframes ringRotate {
    0%   { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* === CHECKMARK (Phase 5) === */
  .checkmark-group {
    opacity: 0;
    animation: checkFade 9s ease infinite;
  }
  @keyframes checkFade {
    0%   { opacity: 0; }
    87%  { opacity: 0; }
    90%  { opacity: 1; }
    97%  { opacity: 1; }
    100% { opacity: 0; }
  }
  .check-stroke {
    stroke-dasharray: 28;
    stroke-dashoffset: 28;
    animation: checkDraw 9s ease infinite;
  }
  @keyframes checkDraw {
    0%   { stroke-dashoffset: 28; }
    87%  { stroke-dashoffset: 28; }
    92%  { stroke-dashoffset: 0; }
    97%  { stroke-dashoffset: 0; }
    100% { stroke-dashoffset: 28; }
  }

  /* === DATA STRUCTURE LINES (inside nodes) === */
  .struct-line {
    stroke: rgba(255,255,255,0.06);
    stroke-width: 1;
    stroke-linecap: round;
  }

  /* === STEP LABELS === */
  .step-label {
    fill: rgba(255,255,255,0.12);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 9px;
    text-anchor: middle;
    font-variant-numeric: tabular-nums;
  }
</style>

<defs>
  <filter id="particleGlow" x="-200%" y="-200%" width="500%" height="500%">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="nodeGlowFilter" x="-80%" y="-80%" width="260%" height="260%">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <filter id="scanGlowFilter" x="-5%" y="-100%" width="110%" height="300%">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>
  <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1ab759" stop-opacity="0"/>
    <stop offset="35%" stop-color="#1ab759" stop-opacity="0.06"/>
    <stop offset="50%" stop-color="#1ab759" stop-opacity="0.12"/>
    <stop offset="65%" stop-color="#1ab759" stop-opacity="0.06"/>
    <stop offset="100%" stop-color="#1ab759" stop-opacity="0"/>
  </linearGradient>
</defs>

<!-- ===== LAYER 1: Base connection lines ===== -->
<g>
  <line class="tree-line" x1="300" y1="44" x2="180" y2="134"/>
  <line class="tree-line" x1="300" y1="44" x2="420" y2="134"/>
  <line class="tree-line" x1="180" y1="134" x2="100" y2="230"/>
  <line class="tree-line" x1="180" y1="134" x2="300" y2="230"/>
  <line class="tree-line" x1="420" y1="134" x2="380" y2="230"/>
  <line class="tree-line" x1="420" y1="134" x2="500" y2="230"/>
  <line class="tree-line" x1="300" y1="230" x2="300" y2="326"/>
</g>

<!-- ===== LAYER 2: Animated line glow overlays ===== -->
<g>
  <!-- Phase 1 glow (all lines) -->
  <line class="line-glow-p1" x1="300" y1="44" x2="180" y2="134"/>
  <line class="line-glow-p1" x1="300" y1="44" x2="420" y2="134"/>
  <line class="line-glow-p1" x1="180" y1="134" x2="100" y2="230"/>
  <line class="line-glow-p1" x1="180" y1="134" x2="300" y2="230"/>
  <line class="line-glow-p1" x1="420" y1="134" x2="380" y2="230"/>
  <line class="line-glow-p1" x1="420" y1="134" x2="500" y2="230"/>
  <line class="line-glow-p1" x1="300" y1="230" x2="300" y2="326"/>

  <!-- Problem lines (N2-N5 and N5-N8 turn red in phase 2) -->
  <line class="line-problem-n2n5" x1="180" y1="134" x2="300" y2="230"/>
  <line class="line-problem-n5n8" x1="300" y1="230" x2="300" y2="326"/>

  <!-- Phase 4 replay glow (N5-N8 only) -->
  <line class="line-glow-replay" x1="300" y1="230" x2="300" y2="326"/>

  <!-- Phase 4-5 final glow (all lines) -->
  <line class="line-glow-final" x1="300" y1="44" x2="180" y2="134"/>
  <line class="line-glow-final" x1="300" y1="44" x2="420" y2="134"/>
  <line class="line-glow-final" x1="180" y1="134" x2="100" y2="230"/>
  <line class="line-glow-final" x1="180" y1="134" x2="300" y2="230"/>
  <line class="line-glow-final" x1="420" y1="134" x2="380" y2="230"/>
  <line class="line-glow-final" x1="420" y1="134" x2="500" y2="230"/>
  <line class="line-glow-final" x1="300" y1="230" x2="300" y2="326"/>
</g>

<!-- ===== LAYER 3: AI scan beam (Phase 2) ===== -->
<rect class="scan-beam" x="40" y="190" width="520" height="40" rx="3" fill="url(#scanGrad)" filter="url(#scanGlowFilter)"/>

<!-- ===== LAYER 4: Nodes ===== -->
<g>
  <!-- N1 (root) -->
  <circle cx="300" cy="44" r="14" class="node-base node-normal nd-1"/>
  <line class="struct-line" x1="294" y1="40" x2="300" y2="40"/>
  <line class="struct-line" x1="294" y1="44" x2="306" y2="44"/>
  <line class="struct-line" x1="294" y1="48" x2="302" y2="48"/>

  <!-- N2 -->
  <circle cx="180" cy="134" r="14" class="node-base node-normal nd-2"/>
  <line class="struct-line" x1="174" y1="130" x2="182" y2="130"/>
  <line class="struct-line" x1="174" y1="134" x2="186" y2="134"/>
  <line class="struct-line" x1="174" y1="138" x2="180" y2="138"/>

  <!-- N3 -->
  <circle cx="420" cy="134" r="14" class="node-base node-normal nd-3"/>
  <line class="struct-line" x1="414" y1="130" x2="424" y2="130"/>
  <line class="struct-line" x1="414" y1="134" x2="420" y2="134"/>
  <line class="struct-line" x1="414" y1="138" x2="426" y2="138"/>

  <!-- N4 -->
  <circle cx="100" cy="230" r="14" class="node-base node-normal nd-4"/>
  <line class="struct-line" x1="94" y1="226" x2="100" y2="226"/>
  <line class="struct-line" x1="94" y1="230" x2="106" y2="230"/>
  <line class="struct-line" x1="94" y1="234" x2="102" y2="234"/>

  <!-- N5 (PROBLEM) -->
  <circle cx="300" cy="230" r="14" class="problem-glow" filter="url(#nodeGlowFilter)"/>
  <circle cx="300" cy="230" r="14" class="node-base node-problem"/>
  <line class="struct-line" x1="294" y1="226" x2="302" y2="226"/>
  <line class="struct-line" x1="294" y1="230" x2="306" y2="230"/>
  <line class="struct-line" x1="294" y1="234" x2="300" y2="234"/>

  <!-- N6 -->
  <circle cx="380" cy="230" r="14" class="node-base node-normal nd-6"/>
  <line class="struct-line" x1="374" y1="226" x2="384" y2="226"/>
  <line class="struct-line" x1="374" y1="230" x2="380" y2="230"/>
  <line class="struct-line" x1="374" y1="234" x2="386" y2="234"/>

  <!-- N7 -->
