<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>APIANT Admin</title>
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="https://apiant.com/favicon.ico">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0c0c0c;
      color: #f7f8f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .admin-login, .admin-panel {
      width: 90%;
      max-width: 520px;
      background: rgba(12, 14, 18, 0.97);
      border: 1px solid rgba(26, 183, 89, 0.12);
      border-radius: 20px;
      padding: 44px 40px 36px;
      box-shadow: 0 0 80px rgba(26, 183, 89, 0.05), 0 25px 60px rgba(0, 0, 0, 0.6);
      position: relative;
    }
    .admin-panel { max-width: 600px; }

    .admin-login::before, .admin-panel::before {
      content: '';
      position: absolute;
      top: 0; left: 15%; right: 15%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #1ab759, transparent);
      border-radius: 0 0 2px 2px;
    }

    h1 {
      font-family: 'DM Sans', sans-serif;
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }
    .subtitle {
      color: rgba(255,255,255,0.45);
      font-size: 14px;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    label {
      display: block;
      color: rgba(255,255,255,0.5);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }

    input, select {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      padding: 13px 16px;
      color: #f7f8f8;
      font-size: 15px;
      font-family: inherit;
      transition: border-color 0.2s;
      margin-bottom: 18px;
    }
    input:focus, select:focus {
      outline: none;
      border-color: rgba(26,183,89,0.5);
      box-shadow: 0 0 0 3px rgba(26,183,89,0.08);
    }

    .btn {
      display: inline-block;
      background: linear-gradient(160deg, #22c95e 0%, #1ab759 40%, #128a42 100%);
      color: #fff;
      padding: 14px 32px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      border: 1px solid rgba(255,255,255,0.1);
      cursor: pointer;
      width: 100%;
      transition: all 0.25s ease;
      font-family: inherit;
    }
    .btn:hover {
      box-shadow: 0 0 36px rgba(26,183,89,0.3), 0 6px 20px rgba(0,0,0,0.3);
      transform: translateY(-1px);
    }

    /* Toggle switch */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .toggle-label {
      font-size: 16px;
      font-weight: 600;
    }
    .toggle-desc {
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      margin-top: 4px;
    }
    .toggle-switch {
      position: relative;
      width: 56px;
      height: 30px;
      flex-shrink: 0;
      margin-left: 16px;
    }
    .toggle-switch input { opacity: 0; width: 0; height: 0; }
    .toggle-track {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: rgba(255,255,255,0.1);
      border-radius: 30px;
      transition: background 0.3s;
    }
    .toggle-track::before {
      content: '';
      position: absolute;
      width: 24px;
      height: 24px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: transform 0.3s;
    }
    .toggle-switch input:checked + .toggle-track {
      background: #1ab759;
    }
    .toggle-switch input:checked + .toggle-track::before {
      transform: translateX(26px);
    }

    .status-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      margin-right: 8px;
    }
    .status-dot.on { background: #1ab759; box-shadow: 0 0 8px rgba(26,183,89,0.5); }
    .status-dot.off { background: rgba(255,255,255,0.2); }

    .section {
      padding: 20px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .section:last-child { border-bottom: none; }
    .section h2 {
      font-size: 14px;
      font-weight: 600;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 16px;
    }

    .row { display: flex; gap: 12px; }
    .row > * { flex: 1; }

    .days-grid {
      display: flex;
      gap: 6px;
      margin-bottom: 18px;
    }
    .day-btn {
      flex: 1;
      padding: 8px 4px;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      background: rgba(255,255,255,0.03);
      color: rgba(255,255,255,0.5);
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .day-btn.active {
      background: rgba(26,183,89,0.12);
      border-color: rgba(26,183,89,0.4);
      color: #1ab759;
    }

    .save-status {
      text-align: center;
      font-size: 14px;
      color: #1ab759;
      margin-top: 12px;
      min-height: 20px;
    }

    .hidden { display: none; }

    @media (max-width: 480px) {
      .admin-login, .admin-panel { padding: 28px 20px 24px; }
      .row { flex-direction: column; gap: 0; }
    }
  </style>
<link href="/css/cookie-consent.css" rel="stylesheet" type="text/css"/>
</head>
<body>

  <!-- Login -->
  <div class="admin-login" id="admin-login">
    <h1>APIANT Admin</h1>
    <p class="subtitle">Sign in to continue.</p>
    <label for="admin-email">Email</label>
    <input type="email" id="admin-email" placeholder="you@company.com" autofocus>
    <label for="admin-pass" style="margin-top:12px;">Password</label>
    <input type="password" id="admin-pass" placeholder="Enter password">
    <button class="btn" onclick="adminLogin()">Sign In</button>
    <div id="login-error" style="color:#fca5a5; font-size:14px; margin-top:12px; text-align:center;"></div>
  </div>

  <!-- Admin Panel -->
  <div class="admin-panel hidden" id="admin-panel">
    <h1>Lead Routing</h1>
    <p class="subtitle">Control how inbound leads are handled.</p>

    <!-- Availability Toggle -->
    <div class="toggle-row">
      <div>
        <div class="toggle-label">
          <span class="status-dot off" id="status-dot"></span>
          <span id="status-text">Unavailable</span>
        </div>
        <div class="toggle-desc">When on, qualified leads can request an immediate call</div>
      </div>
      <label class="toggle-switch">
        <input type="checkbox" id="toggle-available" onchange="toggleAvailability()">
        <span class="toggle-track"></span>
      </label>
    </div>

    <!-- Voice Agent Toggle -->
    <div class="toggle-row">
      <div>
        <div class="toggle-label">
          <span class="status-dot off" id="voice-dot"></span>
          <span id="voice-text">Voice Agent Off</span>
        </div>
        <div class="toggle-desc">When on, leads see the "Live Voice Call" option (ElevenLabs Alex)</div>
      </div>
      <label class="toggle-switch">
        <input type="checkbox" id="toggle-voice-agent" onchange="toggleVoiceAgent()">
        <span class="toggle-track"></span>
      </label>
    </div>

    <!-- Business Hours -->
    <div class="section">
      <h2>Business Hours</h2>
      <label for="admin-tz">Timezone</label>
      <select id="admin-tz">
        <option value="America/New_York">Eastern (ET)</option>
        <option value="America/Chicago">Central (CT)</option>
        <option value="America/Denver">Mountain (MT)</option>
        <option value="America/Los_Angeles">Pacific (PT)</option>
        <option value="America/Phoenix">Arizona (no DST)</option>
        <option value="Europe/London">London (GMT/BST)</option>
        <option value="Europe/Paris">Central Europe (CET)</option>
        <option value="Asia/Tokyo">Tokyo (JST)</option>
        <option value="Australia/Sydney">Sydney (AEST)</option>
        <option value="UTC">UTC</option>
      </select>

      <label>Days</label>
      <div class="days-grid">
        <button class="day-btn" data-day="0">Sun</button>
        <button class="day-btn active" data-day="1">Mon</button>
        <button class="day-btn active" data-day="2">Tue</button>
        <button class="day-btn active" data-day="3">Wed</button>
        <button class="day-btn active" data-day="4">Thu</button>
        <button class="day-btn active" data-day="5">Fri</button>
        <button class="day-btn" data-day="6">Sat</button>
      </div>

      <div class="row">
        <div>
          <label for="admin-start">Start</label>
          <input type="time" id="admin-start" value="09:00">
        </div>
        <div>
          <label for="admin-end">End</label>
          <input type="time" id="admin-end" value="17:00">
        </div>
      </div>
    </div>

    <!-- Calendly -->
    <div class="section">
      <h2>Calendly</h2>
      <label for="admin-calendly">Booking URL</label>
      <input type="url" id="admin-calendly" placeholder="https://calendly.com/your-link">
    </div>

    <button class="btn" onclick="saveSettings()">Save Settings</button>
    <div class="save-status" id="save-status"></div>
  </div>

  <script>
    // Configuration
    var SUPABASE_URL = 'https://kereljzjgeerrdnssttu.supabase.co'; // Set after creating Supabase project
    var ADMIN_PASSWORD = '';

    // Day buttons
    document.querySelectorAll('.day-btn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        btn.classList.toggle('active');
      });
    });

    function adminLogin() {
      var email = document.getElementById('admin-email').value.trim();
      ADMIN_PASSWORD = document.getElementById('admin-pass').value;
      if (!email || !ADMIN_PASSWORD) {
        document.getElementById('login-error').textContent = 'Enter your email and password.';
        return;
      }

      if (!SUPABASE_URL) {
        document.getElementById('login-error').textContent = 'Supabase URL not configured. Set SUPABASE_URL in admin.html.';
        return;
      }

      fetch(SUPABASE_URL + '/functions/v1/check-availability', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'get_settings', password: ADMIN_PASSWORD, email: email })
      })
      .then(function(r) {
        if (r.status === 401) throw new Error('Invalid email or password');
        return r.json();
      })
      .then(function(data) {
        if (data.error) throw new Error(data.error);
        // Populate form
        document.getElementById('toggle-available').checked = data.available || false;
        document.getElementById('toggle-voice-agent').checked = data.voice_agent_enabled !== false;
        document.getElementById('admin-tz').value = data.timezone || 'America/New_York';
        document.getElementById('admin-start').value = data.business_hours_start || '09:00';
        document.getElementById('admin-end').value = data.business_hours_end || '17:00';
        document.getElementById('admin-calendly').value = data.calendly_url || '';

        updateVoiceDot(data.voice_agent_enabled !== false);

        // Set day buttons
        var days = data.business_days || [1,2,3,4,5];
        document.querySelectorAll('.day-btn').forEach(function(btn) {
          var d = parseInt(btn.getAttribute('data-day'));
          btn.classList.toggle('active', days.includes(d));
        });

        updateStatusDot(data.available);
        document.getElementById('admin-login').classList.add('hidden');
        document.getElementById('admin-panel').classList.remove('hidden');
      })
      .catch(function(e) {
        document.getElementById('login-error').textContent = e.message || 'Login failed';
      });
    }

    // Enter key for login
    document.getElementById('admin-pass').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') adminLogin();
    });

    function updateStatusDot(available) {
      var dot = document.getElementById('status-dot');
      var text = document.getElementById('status-text');
      dot.className = 'status-dot ' + (available ? 'on' : 'off');
      text.textContent = available ? 'Available' : 'Unavailable';
    }

    function updateVoiceDot(enabled) {
      var dot = document.getElementById('voice-dot');
      var text = document.getElementById('voice-text');
      dot.className = 'status-dot ' + (enabled ? 'on' : 'off');
      text.textContent = enabled ? 'Voice Agent On' : 'Voice Agent Off';
    }

    function toggleVoiceAgent() {
      var enabled = document.getElementById('toggle-voice-agent').checked;
      updateVoiceDot(enabled);
    }

    function toggleAvailability() {
      var available = document.getElementById('toggle-available').checked;
      updateStatusDot(available);

      fetch(SUPABASE_URL + '/functions/v1/check-availability', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'toggle', password: ADMIN_PASSWORD })
      })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.available !== undefined) {
          document.getElementById('toggle-available').checked = data.available;
          updateStatusDot(data.available);
        }
      });
    }

    function saveSettings() {
      var days = [];
      document.querySelectorAll('.day-btn.active').forEach(function(btn) {
        days.push(parseInt(btn.getAttribute('data-day')));
      });

      var settings = {
        action: 'update_settings',
        password: ADMIN_PASSWORD,
        timezone: document.getElementById('admin-tz').value,
        business_hours_start: document.getElementById('admin-start').value,
        business_hours_end: document.getElementById('admin-end').value,
        business_days: days,
        calendly_url: document.getElementById('admin-calendly').value.trim(),
        voice_agent_enabled: document.getElementById('toggle-voice-agent').checked,
      };

      var status = document.getElementById('save-status');
      status.textContent = 'Saving...';
      status.style.color = 'rgba(255,255,255,0.5)';

      fetch(SUPABASE_URL + '/functions/v1/check-availability', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(settings)
      })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (data.success) {
          status.textContent = 'Settings saved';
          status.style.color = '#1ab759';
        } else {
          status.textContent = data.error || 'Save failed';
          status.style.color = '#fca5a5';
        }
        setTimeout(function() { status.textContent = ''; }, 3000);
      })
      .catch(function() {
        status.textContent = 'Network error';
        status.style.color = '#fca5a5';
      });
    }
  </script>
<script src="/js/cookie-consent.js"></script>
</body>
</html>
