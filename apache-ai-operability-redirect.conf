# /ai-operability retirement -> /platform/  (301)
#
# NOT INSTALLED. This file is excluded from the deploy rsync (--exclude='*.conf'),
# so committing it ships nothing. Installing it needs root on the apiant.com host.
# Until it is installed, the retirement is served by a stub page at
# ai-operability.html (and the 20 locale copies) that carries noindex, a canonical
# to /platform/, a meta refresh and a JS replace. The stub works; this config is the
# proper 301 that passes full link equity and stops the URL being crawled at all.
#
# Place inside the apiant.com <VirtualHost *:443> block, then:
#   apachectl configtest && systemctl reload apache2
#
# Context: the page documented the Claude Code plugin and its 42-skill / 138-tool
# inventory. The plugin install was retired on the platform on 2026-09-18 and the
# site is no longer written around a single AI client.

<IfModule mod_alias.c>
    # English
    Redirect 301 /ai-operability      /platform/
    Redirect 301 /ai-operability.html /platform/
</IfModule>

<IfModule mod_rewrite.c>
    RewriteEngine On

    # Locale copies: /es/ai-operability -> /es/platform/ ... for all 20 languages
    RewriteRule ^/(ar|bn|de|es|fr|he|hi|id|it|ja|ko|nl|pl|pt|ru|sv|th|tr|vi|zh)/ai-operability(\.html)?$ /$1/platform/ [R=301,L]

    # Anchors into the retired inventory sections
    RewriteRule ^/ai-operability#inventory-(skills|tools)$ /platform/ [R=301,L]
</IfModule>
