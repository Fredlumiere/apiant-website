<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" fill="none">
  <defs>
    <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141820"/>
      <stop offset="100%" stop-color="#0c0f14"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1ab759" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1ab759" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1ab759" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1ab759" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1ab759"/>
      <stop offset="100%" stop-color="#1ab759"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="500" rx="16" fill="#0c0c0c"/>

  <!-- ===== LEFT PANEL: Assembly Editor ===== -->
  <rect x="24" y="24" width="400" height="452" rx="12" fill="url(#panelBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Cyan glow top-left -->
  <ellipse cx="100" cy="50" rx="120" ry="60" fill="url(#cyanGlow)"/>

  <!-- Panel header -->
  <rect x="24" y="24" width="400" height="40" rx="12" fill="#181c24"/>
  <rect x="24" y="52" width="400" height="12" fill="#181c24"/>
  <!-- Header dots -->
  <circle cx="44" cy="44" r="4" fill="#ff5f57"/>
  <circle cx="58" cy="44" r="4" fill="#febc2e"/>
  <circle cx="72" cy="44" r="4" fill="#28c840"/>
  <text x="224" y="48" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="11" text-anchor="middle" font-weight="500">Assembly Editor + AI Co-Pilot</text>

  <!-- AI Chat bubble -->
  <rect x="44" y="80" width="200" height="32" rx="8" fill="rgba(6,182,212,0.08)" stroke="rgba(6,182,212,0.2)" stroke-width="1"/>
  <!-- Spark icon -->
  <path d="M56 96l1.2 3.6L61 101l-3.6 1.2L56 105.8l-1.2-3.6L51 101l3.6-1.2z" fill="#1ab759"/>
  <text x="68" y="100" fill="#1ab759" font-family="Inter, sans-serif" font-size="10" font-weight="500">Building Stripe connector...</text>

  <!-- Progress bar -->
  <rect x="44" y="122" width="340" height="4" rx="2" fill="rgba(255,255,255,0.06)"/>
  <rect x="44" y="122" width="306" height="4" rx="2" fill="#1ab759" opacity="0.7"/>
  <text x="394" y="128" fill="rgba(255,255,255,0.4)" font-family="Inter, sans-serif" font-size="9" text-anchor="end">90%</text>

  <!-- Assembly tree view -->
  <!-- Root: Stripe -->
  <rect x="44" y="144" width="360" height="28" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="52" y="152" width="12" height="12" rx="3" fill="rgba(6,182,212,0.2)" stroke="#1ab759" stroke-width="0.5"/>
  <text x="72" y="162" fill="#fff" font-family="Inter, sans-serif" font-size="11" font-weight="600">Stripe</text>
  <text x="110" y="162" fill="rgba(255,255,255,0.3)" font-family="Inter, sans-serif" font-size="10">247 endpoints</text>

  <!-- Endpoint groups -->
  <g transform="translate(60, 180)">
    <line x1="0" y1="0" x2="0" y2="220" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>

    <!-- Auth -->
    <rect x="12" y="0" width="320" height="24" rx="5" fill="rgba(255,255,255,0.03)"/>
    <circle cx="24" cy="12" r="4" fill="#1ab759" opacity="0.7"/>
    <text x="36" y="16" fill="rgba(255,255,255,0.7)" font-family="Inter, sans-serif" font-size="10">Authentication</text>
    <text x="320" y="16" fill="#1ab759" font-family="Inter, sans-serif" font-size="9" text-anchor="end">OAuth 2.0 configured</text>

    <!-- Charges -->
    <rect x="12" y="32" width="320" height="24" rx="5" fill="rgba(255,255,255,0.03)"/>
    <rect x="20" y="40" width="8" height="8" rx="2" fill="rgba(6,182,212,0.3)"/>
    <text x="36" y="48" fill="rgba(255,255,255,0.7)" font-family="Inter, sans-serif" font-size="10">Charges</text>
    <text x="320" y="48" fill="rgba(255,255,255,0.3)" font-family="Inter, sans-serif" font-size="9" text-anchor="end">Create, Get, List, Update</text>

    <!-- Customers -->
    <rect x="12" y="64" width="320" height="24" rx="5" fill="rgba(6,182,212,0.04)" stroke="rgba(6,182,212,0.15)" stroke-width="1"/>
    <rect x="20" y="72" width="8" height="8" rx="2" fill="#1ab759"/>
    <text x="36" y="80" fill="#fff" font-family="Inter, sans-serif" font-size="10" font-weight="500">Customers</text>
    <text x="320" y="80" fill="#1ab759" font-family="Inter, sans-serif" font-size="9" text-anchor="end">Create, Get, List, Search, Delete</text>

    <!-- Subscriptions -->
    <rect x="12" y="96" width="320" height="24" rx="5" fill="rgba(255,255,255,0.03)"/>
    <rect x="20" y="104" width="8" height="8" rx="2" fill="rgba(6,182,212,0.3)"/>
    <text x="36" y="112" fill="rgba(255,255,255,0.7)" font-family="Inter, sans-serif" font-size="10">Subscriptions</text>
    <text x="320" y="112" fill="rgba(255,255,255,0.3)" font-family="Inter, sans-serif" font-size="9" text-anchor="end">Create, Get, List, Cancel</text>

    <!-- Invoices -->
    <rect x="12" y="128" width="320" height="24" rx="5" fill="rgba(255,255,255,0.03)"/>
    <rect x="20" y="136" width="8" height="8" rx="2" fill="rgba(6,182,212,0.3)"/>
    <text x="36" y="144" fill="rgba(255,255,255,0.7)" font-family="Inter, sans-serif" font-size="10">Invoices</text>
    <text x="320" y="144" fill="rgba(255,255,255,0.3)" font-family="Inter, sans-serif" font-size="9" text-anchor="end">Create, Get, List, Finalize</text>

    <!-- Payment Intents -->
    <rect x="12" y="160" width="320" height="24" rx="5" fill="rgba(255,255,255,0.03)"/>
    <rect x="20" y="168" width="8" height="8" rx="2" fill="rgba(6,182,212,0.3)"/>
    <text x="36" y="176" fill="rgba(255,255,255,0.7)" font-family="Inter, sans-serif" font-size="10">Payment Intents</text>
    <text x="320" y="176" fill="rgba(255,255,255,0.3)" font-family="Inter, sans-serif" font-size="9" text-anchor="end">Create, Confirm, Capture</text>

    <!-- More... -->
    <text x="24" y="204" fill="rgba(255,255,255,0.25)" font-family="Inter, sans-serif" font-size="10">+ 38 more endpoint groups</text>
  </g>

  <!-- Status bar -->
  <rect x="44" y="436" width="120" height="20" rx="4" fill="rgba(26,183,89,0.1)" stroke="rgba(26,183,89,0.2)" stroke-width="1"/>
  <circle cx="56" cy="446" r="3" fill="#1ab759"/>
  <text x="66" y="450" fill="#1ab759" font-family="Inter, sans-serif" font-size="9" font-weight="500">All tests passed</text>

  <!-- ===== CENTER: Flow Arrow ===== -->
  <g transform="translate(440, 200)">
    <!-- Dashed flowing arrow -->
    <line x1="0" y1="50" x2="55" y2="50" stroke="url(#arrowGrad)" stroke-width="2" stroke-dasharray="6 4" filter="url(#glow)"/>
    <polygon points="60,50 50,44 50,56" fill="#1ab759"/>

    <!-- Label -->
    <rect x="4" y="24" width="52" height="18" rx="9" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="30" y="36" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="8" text-anchor="middle" font-weight="500">becomes</text>

    <!-- Subtext -->
    <text x="30" y="76" fill="rgba(255,255,255,0.25)" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">an action in</text>
  </g>

  <!-- ===== RIGHT PANEL: Automation Editor ===== -->
  <rect x="520" y="24" width="416" height="452" rx="12" fill="url(#panelBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Green glow top-right -->
  <ellipse cx="860" cy="50" rx="120" ry="60" fill="url(#greenGlow)"/>

  <!-- Panel header -->
  <rect x="520" y="24" width="416" height="40" rx="12" fill="#181c24"/>
  <rect x="520" y="52" width="416" height="12" fill="#181c24"/>
  <circle cx="540" cy="44" r="4" fill="#ff5f57"/>
  <circle cx="554" cy="44" r="4" fill="#febc2e"/>
  <circle cx="568" cy="44" r="4" fill="#28c840"/>
  <text x="728" y="48" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="11" text-anchor="middle" font-weight="500">Automation Editor</text>

  <!-- Automation title bar -->
  <rect x="540" y="76" width="376" height="28" rx="6" fill="rgba(26,183,89,0.06)" stroke="rgba(26,183,89,0.15)" stroke-width="1"/>
  <text x="556" y="94" fill="rgba(255,255,255,0.4)" font-family="Inter, sans-serif" font-size="9">Automation #4147</text>
  <text x="660" y="94" fill="rgba(255,255,255,0.6)" font-family="Inter, sans-serif" font-size="10" font-weight="500">Mindbody appointments to Stripe payments</text>

  <!-- Workflow canvas -->
  <!-- Grid lines (subtle) -->
  <line x1="540" y1="140" x2="916" y2="140" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
  <line x1="540" y1="200" x2="916" y2="200" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
  <line x1="540" y1="260" x2="916" y2="260" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
  <line x1="540" y1="320" x2="916" y2="320" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
  <line x1="540" y1="380" x2="916" y2="380" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>

  <!-- Trigger node -->
  <g transform="translate(700, 120)">
    <circle cx="28" cy="16" r="16" fill="#0c0c0c" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <text x="28" y="12" fill="rgba(255,255,255,0.6)" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">TRIGGER</text>
    <text x="28" y="22" fill="#fff" font-family="Inter, sans-serif" font-size="6" text-anchor="middle" font-weight="600">Schedule</text>
  </g>

  <!-- Connection line: Trigger to Mindbody action -->
  <line x1="728" y1="152" x2="728" y2="174" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Mindbody Action node -->
  <g transform="translate(668, 174)">
    <rect width="120" height="44" rx="8" fill="#141820" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <rect x="8" y="8" width="20" height="20" rx="5" fill="rgba(255,255,255,0.06)"/>
    <text x="18" y="22" fill="rgba(255,255,255,0.4)" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">MB</text>
    <text x="36" y="18" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="7">GET</text>
    <text x="36" y="30" fill="#fff" font-family="Inter, sans-serif" font-size="9" font-weight="500">Appointments</text>
  </g>

  <!-- Connection line: Mindbody to Decision -->
  <line x1="728" y1="218" x2="728" y2="242" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Decision diamond -->
  <g transform="translate(728, 258)">
    <rect width="22" height="22" rx="3" fill="#141820" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" transform="translate(0, -11) rotate(45)"/>
    <text x="0" y="4" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="6" text-anchor="middle">IF</text>
  </g>

  <!-- Branch lines from decision -->
  <!-- Left branch: "No" -->
  <line x1="718" y1="262" x2="628" y2="262" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <line x1="628" y1="262" x2="628" y2="290" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="665" y="256" fill="rgba(255,255,255,0.25)" font-family="Inter, sans-serif" font-size="7">No match</text>
  <!-- End node -->
  <rect x="608" y="290" width="40" height="20" rx="10" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="628" y="304" fill="rgba(255,255,255,0.3)" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">Skip</text>

  <!-- Right branch: "Yes" to Stripe action -->
  <line x1="738" y1="262" x2="820" y2="262" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <line x1="820" y1="262" x2="820" y2="290" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  <text x="775" y="256" fill="rgba(255,255,255,0.3)" font-family="Inter, sans-serif" font-size="7">Has payment</text>

  <!-- ===== STRIPE ACTION NODE (highlighted) ===== -->
  <g transform="translate(760, 290)">
    <!-- Glow behind the node -->
    <rect x="-4" y="-4" width="128" height="52" rx="12" fill="rgba(6,182,212,0.06)" filter="url(#softGlow)"/>
    <!-- Node -->
    <rect width="120" height="44" rx="8" fill="#141820" stroke="#1ab759" stroke-width="1.5"/>
    <!-- Stripe icon placeholder -->
    <rect x="8" y="8" width="20" height="20" rx="5" fill="rgba(6,182,212,0.15)" stroke="rgba(6,182,212,0.3)" stroke-width="0.5"/>
    <text x="18" y="22" fill="#1ab759" font-family="Inter, sans-serif" font-size="7" text-anchor="middle" font-weight="700">S</text>
    <text x="36" y="18" fill="rgba(6,182,212,0.7)" font-family="Inter, sans-serif" font-size="7">CREATE</text>
    <text x="36" y="30" fill="#fff" font-family="Inter, sans-serif" font-size="9" font-weight="500">Stripe Charge</text>
    <!-- AI badge -->
    <rect x="82" y="4" width="32" height="14" rx="7" fill="rgba(6,182,212,0.12)" stroke="rgba(6,182,212,0.25)" stroke-width="0.5"/>
    <text x="98" y="14" fill="#1ab759" font-family="Inter, sans-serif" font-size="6" text-anchor="middle" font-weight="600">AI</text>
  </g>

  <!-- Connection line: Stripe to next action -->
  <line x1="820" y1="334" x2="820" y2="358" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- HubSpot Action node -->
  <g transform="translate(760, 358)">
    <rect width="120" height="44" rx="8" fill="#141820" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <rect x="8" y="8" width="20" height="20" rx="5" fill="rgba(255,255,255,0.06)"/>
    <text x="18" y="22" fill="rgba(255,255,255,0.4)" font-family="Inter, sans-serif" font-size="7" text-anchor="middle">HS</text>
    <text x="36" y="18" fill="rgba(255,255,255,0.5)" font-family="Inter, sans-serif" font-size="7">UPDATE</text>
    <text x="36" y="30" fill="#fff" font-family="Inter, sans-serif" font-size="9" font-weight="500">HubSpot Deal</text>
  </g>

  <!-- Connection line: HubSpot to end -->
  <line x1="820" y1="402" x2="820" y2="420" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- End circle -->
  <circle cx="820" cy="430" r="8" fill="#0c0c0c" stroke="rgba(26,183,89,0.4)" stroke-width="1.5"/>
  <circle cx="820" cy="430" r="3" fill="#1ab759"/>

  <!-- Actions counter -->
  <rect x="860" y="436" width="60" height="20" rx="4" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="890" y="450" fill="rgba(255,255,255,0.3)" font-family="Inter, sans-serif" font-size="8" text-anchor="middle">5 actions</text>

  <!-- Callout label pointing to Stripe node -->
  <g transform="translate(560, 310)">
    <rect width="180" height="36" rx="8" fill="rgba(6,182,212,0.06)" stroke="rgba(6,182,212,0.15)" stroke-width="1"/>
    <!-- Spark icon -->
    <path d="M16 18l1 3L21 22.5l-3 1L16 27l-1-3L11 22.5l3-1z" fill="#1ab759" opacity="0.7"/>
    <text x="28" y="22" fill="rgba(255,255,255,0.6)" font-family="Inter, sans-serif" font-size="8">The Stripe assembly built by</text>
    <text x="28" y="32" fill="#1ab759" font-family="Inter, sans-serif" font-size="8" font-weight="600">AI Co-Pilot is now an action</text>
    <!-- Arrow pointing right -->
    <line x1="180" y1="18" x2="196" y2="18" stroke="rgba(6,182,212,0.4)" stroke-width="1" stroke-dasharray="3 2"/>
  </g>
</svg>