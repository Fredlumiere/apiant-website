<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" preserveAspectRatio="xMidYMid meet">
<defs>
  <linearGradient id="sl-bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#0e1117"/>
    <stop offset="100%" stop-color="#0b0e14"/>
  </linearGradient>
  <linearGradient id="sl-sidebar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#0d1017"/>
    <stop offset="100%" stop-color="#0f1319"/>
  </linearGradient>
  <linearGradient id="sl-toggle-on" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#1ab759"/>
    <stop offset="100%" stop-color="#17a34f"/>
  </linearGradient>
</defs>

<!-- Background -->
<rect width="960" height="440" fill="url(#sl-bg)"/>

<!-- ===== LEFT SIDEBAR ===== -->
<rect x="0" y="0" width="160" height="440" fill="url(#sl-sidebar)"/>
<line x1="160" y1="0" x2="160" y2="440" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

<!-- Logo -->
<text x="20" y="28" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="700" letter-spacing="3" fill="#fff">APIANT</text>
<!-- Admin Console label -->
<text x="20" y="50" font-family="Inter,system-ui,sans-serif" font-size="9" fill="rgba(255,255,255,0.3)">Admin Console</text>

<!-- Sidebar nav items -->
<g font-family="Inter,system-ui,sans-serif" font-size="11">
  <!-- Dot + label for each item -->
  <circle cx="26" cy="80" r="3" fill="#1ab759"/>
  <text x="38" y="84" fill="rgba(255,255,255,0.45)">User Activity</text>

  <circle cx="26" cy="104" r="3" fill="#1ab759"/>
  <text x="38" y="108" fill="rgba(255,255,255,0.45)">Work Queue</text>

  <circle cx="26" cy="128" r="3" fill="#1ab759"/>
  <text x="38" y="132" fill="rgba(255,255,255,0.45)">Webhooks</text>

  <circle cx="26" cy="152" r="3" fill="#ef4444"/>
  <text x="38" y="156" fill="rgba(255,255,255,0.45)">Retries</text>

  <circle cx="26" cy="176" r="3" fill="#1ab759"/>
  <text x="38" y="180" fill="rgba(255,255,255,0.45)">Memory Usage</text>

  <circle cx="26" cy="200" r="3" fill="#1ab759"/>
  <text x="38" y="204" fill="rgba(255,255,255,0.45)">Automations</text>

  <circle cx="26" cy="224" r="3" fill="#1ab759"/>
  <text x="38" y="228" fill="rgba(255,255,255,0.45)">Batch Jobs</text>

  <circle cx="26" cy="248" r="3" fill="#1ab759"/>
  <text x="38" y="252" fill="rgba(255,255,255,0.45)">Web Services</text>

  <circle cx="26" cy="272" r="3" fill="#1ab759"/>
  <text x="38" y="276" fill="rgba(255,255,255,0.45)">Tenants</text>

  <circle cx="26" cy="296" r="3" fill="#1ab759"/>
  <text x="38" y="300" fill="rgba(255,255,255,0.45)">User Accounts</text>

  <circle cx="26" cy="320" r="3" fill="#1ab759"/>
  <text x="38" y="324" fill="rgba(255,255,255,0.45)">User Roles</text>

  <circle cx="26" cy="344" r="3" fill="#1ab759"/>
  <text x="38" y="348" fill="rgba(255,255,255,0.45)">App Catalog</text>

  <circle cx="26" cy="368" r="3" fill="#1ab759"/>
  <text x="38" y="372" fill="rgba(255,255,255,0.45)">Alert Mappings</text>

  <!-- Active item: System Settings -->
  <rect x="8" y="383" width="144" height="28" rx="4" fill="#1ab759"/>
  <circle cx="26" cy="397" r="3" fill="#fff"/>
  <text x="38" y="401" fill="#fff" font-weight="600">System Settings</text>
</g>

<!-- ===== TOP BAR ===== -->
<rect x="160" y="0" width="800" height="44" fill="rgba(255,255,255,0.02)"/>
<line x1="160" y1="44" x2="960" y2="44" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
<text x="190" y="28" font-family="Inter,system-ui,sans-serif" font-size="11" fill="rgba(255,255,255,0.35)">Admin Console</text>
<text x="560" y="28" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">Per-Customer Settings</text>

<!-- ===== MAIN CONTENT: TWO-PANEL VIEW ===== -->

<!-- Customer selector bar -->
<rect x="180" y="58" width="760" height="36" rx="6" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>
<g font-family="Inter,system-ui,sans-serif">
  <text x="200" y="80" font-size="10" fill="rgba(255,255,255,0.35)">Account:</text>
  <rect x="250" y="64" width="180" height="24" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
  <text x="264" y="80" font-size="10" fill="rgba(255,255,255,0.6)">CoreFit Studio (Location 3)</text>
  <path d="M 418 74 L 422 78 L 426 74" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

  <text x="470" y="80" font-size="10" fill="rgba(255,255,255,0.35)">Product:</text>
  <rect x="515" y="64" width="150" height="24" rx="4" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
  <text x="529" y="80" font-size="10" fill="rgba(255,255,255,0.6)">CRMConnect (HubSpot)</text>
  <path d="M 653 74 L 657 78 L 661 74" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

  <!-- Apply button -->
  <rect x="860" y="64" width="64" height="24" rx="4" fill="#1ab759"/>
  <text x="892" y="80" font-size="10" font-weight="600" fill="#fff" text-anchor="middle">Apply</text>
</g>

<!-- ===== LEFT PANEL: SETTINGS TABLE ===== -->
<rect x="180" y="106" width="380" height="320" rx="8" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>

<!-- Panel header -->
<rect x="180" y="106" width="380" height="32" rx="8" fill="rgba(255,255,255,0.03)"/>
<rect x="180" y="130" width="380" height="8" fill="rgba(255,255,255,0.015)"/>
<text x="200" y="127" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="rgba(255,255,255,0.6)">SETTING</text>
<text x="460" y="127" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="rgba(255,255,255,0.6)" text-anchor="end">VALUE</text>
<text x="540" y="127" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="rgba(255,255,255,0.6)" text-anchor="end">STATUS</text>

<!-- Row 1 -->
<g font-family="Inter,system-ui,sans-serif">
  <line x1="190" y1="168" x2="550" y2="168" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
  <text x="200" y="158" font-size="10" fill="rgba(255,255,255,0.55)">Custom object appointments</text>
  <!-- Toggle ON -->
  <rect x="500" y="145" width="32" height="18" rx="9" fill="url(#sl-toggle-on)"/>
  <circle cx="523" cy="154" r="6.5" fill="#fff"/>

  <!-- Row 2 -->
  <line x1="190" y1="200" x2="550" y2="200" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
  <text x="200" y="190" font-size="10" fill="rgba(255,255,255,0.55)">Timezone</text>
  <rect x="420" y="176" width="112" height="20" rx="3" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>
  <text x="432" y="190" font-size="9" fill="rgba(255,255,255,0.4)">America/Chicago</text>

  <!-- Row 3 -->
  <line x1="190" y1="232" x2="550" y2="232" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
  <text x="200" y="222" font-size="10" fill="rgba(255,255,255,0.55)">Multi-location tracking</text>
  <rect x="500" y="209" width="32" height="18" rx="9" fill="url(#sl-toggle-on)"/>
  <circle cx="523" cy="218" r="6.5" fill="#fff"/>

  <!-- Row 4 -->
  <line x1="190" y1="264" x2="550" y2="264" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
  <text x="200" y="254" font-size="10" fill="rgba(255,255,255,0.55)">Sync memberships</text>
  <!-- Toggle OFF -->
  <rect x="500" y="241" width="32" height="18" rx="9" fill="rgba(255,255,255,0.08)"/>
  <circle cx="509" cy="250" r="6.5" fill="rgba(255,255,255,0.35)"/>

  <!-- Row 5 -->
  <line x1="190" y1="296" x2="550" y2="296" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
  <text x="200" y="286" font-size="10" fill="rgba(255,255,255,0.55)">Snowbird support</text>
  <rect x="500" y="273" width="32" height="18" rx="9" fill="url(#sl-toggle-on)"/>
  <circle cx="523" cy="282" r="6.5" fill="#fff"/>

  <!-- Row 6 -->
  <line x1="190" y1="328" x2="550" y2="328" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
  <text x="200" y="318" font-size="10" fill="rgba(255,255,255,0.55)">HubSpot pipeline ID</text>
  <rect x="420" y="304" width="112" height="20" rx="3" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>
  <text x="432" y="318" font-size="9" fill="rgba(255,255,255,0.4)">pipeline_82a</text>

  <!-- Row 7 -->
  <line x1="190" y1="360" x2="550" y2="360" stroke="rgba(255,255,255,0.03)" stroke-width="0.5"/>
  <text x="200" y="350" font-size="10" fill="rgba(255,255,255,0.55)">Rate limit (req/sec)</text>
  <rect x="420" y="336" width="112" height="20" rx="3" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.07)" stroke-width="0.5"/>
  <text x="432" y="350" font-size="9" fill="rgba(255,255,255,0.4)">5</text>

  <!-- Row 8 -->
  <text x="200" y="382" font-size="10" fill="rgba(255,255,255,0.55)">Sync frequency</text>
  <rect x="420" y="368" width="112" height="20" rx="3" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="0.5"/>
  <text x="432" y="382" font-size="9" fill="rgba(255,255,255,0.4)">Every 15m</text>
  <rect x="400" y="372" width="14" height="12" rx="2" fill="rgba(26,183,89,0.15)"/>
  <text x="407" y="381" font-size="7" fill="#1ab759" text-anchor="middle">&#9662;</text>
</g>

<!-- ===== CONNECTING ARROWS (Settings → Logic) ===== -->
<g stroke="#1ab759" stroke-width="1" stroke-dasharray="4 3" opacity="0.35" fill="none">
  <path d="M 560 154 L 588 154 L 588 190"/>
  <path d="M 560 282 L 575 282 L 575 310 L 588 310"/>
</g>
<!-- Arrow tips -->
<polygon points="585,190 588,182 591,190" fill="rgba(26,183,89,0.35)"/>
<polygon points="585,310 592,307 592,313" fill="rgba(26,183,89,0.35)"/>

<!-- ===== RIGHT PANEL: LOGIC FLOW ===== -->
<rect x="580" y="106" width="360" height="320" rx="8" fill="rgba(255,255,255,0.015)" stroke="rgba(255,255,255,0.05)" stroke-width="0.5"/>

<!-- Panel header -->
<rect x="580" y="106" width="360" height="32" rx="8" fill="rgba(255,255,255,0.03)"/>
<rect x="580" y="130" width="360" height="8" fill="rgba(255,255,255,0.015)"/>
<text x="600" y="127" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="600" fill="rgba(255,255,255,0.6)">AUTOMATION LOGIC</text>
<text x="920" y="127" font-family="Inter,system-ui,sans-serif" font-size="9" fill="rgba(26,183,89,0.5)" text-anchor="end">Live Preview</text>

<!-- Flow diagram inside right panel -->
<g font-family="Inter,system-ui,sans-serif">
  <!-- Subtle grid -->
  <pattern id="lgrid" width="20" height="20" patternUnits="userSpaceOnUse">
    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.012)" stroke-width="0.5"/>
  </pattern>
  <rect x="580" y="138" width="360" height="288" fill="url(#lgrid)"/>

  <!-- Read Settings node -->
  <rect x="710" y="152" width="100" height="26" rx="5" fill="#1a2332" stroke="rgba(26,183,89,0.3)" stroke-width="0.8"/>
  <text x="760" y="169" font-size="9" fill="#1ab759" text-anchor="middle" font-weight="600">Read Settings</text>
  <line x1="760" y1="178" x2="760" y2="196" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Diamond: Custom Objects? -->
  <rect x="741" y="196" width="38" height="38" rx="4" fill="#1a2332" stroke="rgba(255,255,255,0.12)" stroke-width="0.8" transform="rotate(45 760 215)"/>
  <text x="760" y="219" font-size="7" fill="rgba(255,255,255,0.4)" text-anchor="middle">Custom Obj?</text>

  <!-- True branch (right) -->
  <line x1="787" y1="215" x2="860" y2="252" stroke="#1ab759" stroke-width="0.8" opacity="0.5"/>
  <text x="830" y="228" font-size="7" fill="#1ab759">True</text>
  <rect x="820" y="252" width="100" height="22" rx="4" fill="#1a2332" stroke="rgba(230,130,60,0.3)" stroke-width="0.8"/>
  <text x="870" y="267" font-size="8" fill="rgba(230,130,60,0.8)" text-anchor="middle">Create Custom Obj</text>

  <!-- False branch (left) -->
  <line x1="733" y1="215" x2="660" y2="252" stroke="#ef4444" stroke-width="0.8" opacity="0.4"/>
  <text x="688" y="228" font-size="7" fill="#ef4444">False</text>
  <rect x="610" y="252" width="100" height="22" rx="4" fill="#1a2332" stroke="rgba(230,130,60,0.3)" stroke-width="0.8"/>
  <text x="660" y="267" font-size="8" fill="rgba(230,130,60,0.8)" text-anchor="middle">Update Fields</text>

  <!-- Snowbird check (continues from True branch) -->
  <line x1="870" y1="274" x2="870" y2="296" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <rect x="851" y="296" width="38" height="38" rx="4" fill="#1a2332" stroke="rgba(255,255,255,0.1)" stroke-width="0.8" transform="rotate(45 870 315)"/>
  <text x="870" y="319" font-size="7" fill="rgba(255,255,255,0.35)" text-anchor="middle">Snowbird?</text>

  <line x1="870" y1="342" x2="870" y2="360" stroke="#1ab759" stroke-width="0.8" opacity="0.4"/>
  <rect x="820" y="360" width="100" height="22" rx="4" fill="#1a2332" stroke="rgba(59,130,246,0.3)" stroke-width="0.8"/>
  <text x="870" y="375" font-size="8" fill="rgba(59,130,246,0.8)" text-anchor="middle">Multi-Loc Update</text>

  <!-- Left branch continues to log -->
  <line x1="660" y1="274" x2="660" y2="292" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <rect x="614" y="292" width="92" height="22" rx="4" fill="#1a2332" stroke="rgba(59,130,246,0.3)" stroke-width="0.8"/>
  <text x="660" y="307" font-size="8" fill="rgba(59,130,246,0.8)" text-anchor="middle">Log Sync Result</text>

  <!-- Active pulse on "Read Settings" node -->
  <rect x="710" y="152" width="100" height="26" rx="5" fill="none" stroke="rgba(26,183,89,0.15)" stroke-width="3"/>
</g>

<!-- Footer info -->
<text x="560" y="436" font-family="Inter,system-ui,sans-serif" font-size="8" fill="rgba(255,255,255,0.12)" text-anchor="middle">Same logic, different settings per customer</text>

</svg>