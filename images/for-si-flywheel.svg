<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <!-- Generic glow filter (color-neutral) -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Center circle gradient -->
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="centerFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Per-segment arrowhead markers -->
    <marker id="arr1" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 L2,3 Z" fill="#f59e0b"/>
    </marker>
    <marker id="arr2" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 L2,3 Z" fill="#ef7c3c"/>
    </marker>
    <marker id="arr3" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 L2,3 Z" fill="#e35d6a"/>
    </marker>
    <marker id="arr4" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 L2,3 Z" fill="#cc4990"/>
    </marker>
    <marker id="arr5" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 L2,3 Z" fill="#aa4db2"/>
    </marker>
    <marker id="arr6" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 L2,3 Z" fill="#8358c6"/>
    </marker>
    <marker id="arr7" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 L2,3 Z" fill="#5c6bd6"/>
    </marker>
    <marker id="arr8" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 L2,3 Z" fill="#3b82f6"/>
    </marker>
  </defs>

  <style>
    text { font-family: 'Inter', sans-serif; }
  </style>

  <!-- ==================== CURVED ARROWS (gradient from orange to blue) ==================== -->

  <!-- Arrow 1: Identify -> Build (orange) -->
  <path d="M 330,105 A 195,195 0 0,1 435,165" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-opacity="0.7" marker-end="url(#arr1)"/>

  <!-- Arrow 2: Build -> Separate (orange-red) -->
  <path d="M 460,180 A 195,195 0 0,1 495,275" fill="none" stroke="#ef7c3c" stroke-width="1.8" stroke-opacity="0.7" marker-end="url(#arr2)"/>

  <!-- Arrow 3: Separate -> Package (coral) -->
  <path d="M 495,330 A 195,195 0 0,1 460,425" fill="none" stroke="#e35d6a" stroke-width="1.8" stroke-opacity="0.7" marker-end="url(#arr3)"/>

  <!-- Arrow 4: Package -> Distribute (magenta) -->
  <path d="M 435,445 A 195,195 0 0,1 330,497" fill="none" stroke="#cc4990" stroke-width="1.8" stroke-opacity="0.7" marker-end="url(#arr4)"/>

  <!-- Arrow 5: Distribute -> Support (purple) -->
  <path d="M 270,497 A 195,195 0 0,1 167,445" fill="none" stroke="#aa4db2" stroke-width="1.8" stroke-opacity="0.7" marker-end="url(#arr5)"/>

  <!-- Arrow 6: Support -> Grow (blue-purple) -->
  <path d="M 142,425 A 195,195 0 0,1 107,330" fill="none" stroke="#8358c6" stroke-width="1.8" stroke-opacity="0.7" marker-end="url(#arr6)"/>

  <!-- Arrow 7: Grow -> Expand (indigo) -->
  <path d="M 107,275 A 195,195 0 0,1 142,180" fill="none" stroke="#5c6bd6" stroke-width="1.8" stroke-opacity="0.7" marker-end="url(#arr7)"/>

  <!-- Arrow 8: Expand -> Identify (blue) -->
  <path d="M 167,165 A 195,195 0 0,1 270,105" fill="none" stroke="#3b82f6" stroke-width="1.8" stroke-opacity="0.7" marker-end="url(#arr8)"/>


  <!-- ==================== SEGMENT 1: Identify (top) - #f59e0b orange ==================== -->
  <g transform="translate(300, 82)" filter="url(#glow)">
    <circle cx="0" cy="0" r="28" fill="rgba(245,158,11,0.12)" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.4"/>
    <g transform="translate(-12,-12)" stroke="#f59e0b" stroke-width="1.8" fill="none">
      <circle cx="11" cy="11" r="7"/>
      <line x1="16" y1="16" x2="22" y2="22" stroke-linecap="round"/>
    </g>
  </g>
  <text x="300" y="126" text-anchor="middle" fill="#f7f8f8" font-size="13" font-weight="500">Identify</text>

  <!-- ==================== SEGMENT 2: Build (top-right) - #ef7c3c orange-red ==================== -->
  <g transform="translate(454, 146)" filter="url(#glow)">
    <circle cx="0" cy="0" r="28" fill="rgba(239,124,60,0.12)" stroke="#ef7c3c" stroke-width="1" stroke-opacity="0.4"/>
    <g transform="translate(-12,-12)" stroke="#ef7c3c" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.7,6.3a4.8,4.8 0 0,0-6.3,4.5c0,.5.1,1,.2,1.5L3.3,17.6a1.5,1.5 0 0,0,0,2.1l1,1a1.5,1.5 0 0,0,2.1,0l5.3-5.3c.5.1,1,.2,1.5.2a4.8,4.8 0 0,0,4.5-6.3l-2.8,2.8-2-0.5-0.5-2Z"/>
    </g>
  </g>
  <text x="454" y="190" text-anchor="middle" fill="#f7f8f8" font-size="13" font-weight="500">Build</text>

  <!-- ==================== SEGMENT 3: Separate (right) - #e35d6a coral ==================== -->
  <g transform="translate(518, 300)" filter="url(#glow)">
    <circle cx="0" cy="0" r="28" fill="rgba(227,93,106,0.12)" stroke="#e35d6a" stroke-width="1" stroke-opacity="0.4"/>
    <g transform="translate(-12,-12)" stroke="#e35d6a" stroke-width="1.8" fill="none" stroke-linecap="round">
      <circle cx="6" cy="18" r="3"/>
      <circle cx="18" cy="18" r="3"/>
      <line x1="12" y1="4" x2="8" y2="15.2"/>
      <line x1="12" y1="4" x2="16" y2="15.2"/>
    </g>
  </g>
  <text x="518" y="344" text-anchor="middle" fill="#f7f8f8" font-size="13" font-weight="500">Separate</text>

  <!-- ==================== SEGMENT 4: Package (bottom-right) - #cc4990 magenta ==================== -->
  <g transform="translate(454, 454)" filter="url(#glow)">
    <circle cx="0" cy="0" r="28" fill="rgba(204,73,144,0.12)" stroke="#cc4990" stroke-width="1" stroke-opacity="0.4"/>
    <g transform="translate(-12,-12)" stroke="#cc4990" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3,7 L12,2 L21,7 L21,17 L12,22 L3,17 Z"/>
      <line x1="12" y1="12" x2="12" y2="22"/>
      <line x1="3" y1="7" x2="12" y2="12"/>
      <line x1="21" y1="7" x2="12" y2="12"/>
    </g>
  </g>
  <text x="454" y="498" text-anchor="middle" fill="#f7f8f8" font-size="13" font-weight="500">Package</text>

  <!-- ==================== SEGMENT 5: Distribute (bottom) - #aa4db2 purple ==================== -->
  <g transform="translate(300, 518)" filter="url(#glow)">
    <circle cx="0" cy="0" r="28" fill="rgba(170,77,178,0.12)" stroke="#aa4db2" stroke-width="1" stroke-opacity="0.4"/>
    <g transform="translate(-12,-12)" stroke="#aa4db2" stroke-width="1.8" fill="none" stroke-linecap="round">
      <circle cx="18" cy="5" r="3"/>
      <circle cx="6" cy="12" r="3"/>
      <circle cx="18" cy="19" r="3"/>
      <line x1="8.6" y1="10.5" x2="15.4" y2="6.5"/>
      <line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/>
    </g>
  </g>
  <text x="300" y="562" text-anchor="middle" fill="#f7f8f8" font-size="13" font-weight="500">Distribute</text>

  <!-- ==================== SEGMENT 6: Support (bottom-left) - #8358c6 blue-purple ==================== -->
  <g transform="translate(146, 454)" filter="url(#glow)">
    <circle cx="0" cy="0" r="28" fill="rgba(131,88,198,0.12)" stroke="#8358c6" stroke-width="1" stroke-opacity="0.4"/>
    <g transform="translate(-12,-12)" stroke="#8358c6" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4,17 V12 A8,8 0 0,1 20,12 V17"/>
      <rect x="2" y="14" width="4" height="6" rx="1"/>
      <rect x="18" y="14" width="4" height="6" rx="1"/>
      <path d="M20,20 V21 A2,2 0 0,1 18,23 H14"/>
    </g>
  </g>
  <text x="146" y="498" text-anchor="middle" fill="#f7f8f8" font-size="13" font-weight="500">Support</text>

  <!-- ==================== SEGMENT 7: Grow (left) - #5c6bd6 indigo ==================== -->
  <g transform="translate(82, 300)" filter="url(#glow)">
    <circle cx="0" cy="0" r="28" fill="rgba(92,107,214,0.12)" stroke="#5c6bd6" stroke-width="1" stroke-opacity="0.4"/>
    <g transform="translate(-12,-12)" stroke="#5c6bd6" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="4,18 10,12 14,16 20,6"/>
      <polyline points="15,6 20,6 20,11"/>
    </g>
  </g>
  <text x="82" y="344" text-anchor="middle" fill="#f7f8f8" font-size="13" font-weight="500">Grow</text>

  <!-- ==================== SEGMENT 8: Expand (top-left) - #3b82f6 blue ==================== -->
  <g transform="translate(146, 146)" filter="url(#glow)">
    <circle cx="0" cy="0" r="28" fill="rgba(59,130,246,0.12)" stroke="#3b82f6" stroke-width="1" stroke-opacity="0.4"/>
    <g transform="translate(-12,-12)" stroke="#3b82f6" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="4,4 10,4 4,4 4,10"/>
      <line x1="4" y1="4" x2="10.5" y2="10.5"/>
      <polyline points="20,4 14,4 20,4 20,10"/>
      <line x1="20" y1="4" x2="13.5" y2="10.5"/>
      <polyline points="4,20 10,20 4,20 4,14"/>
      <line x1="4" y1="20" x2="10.5" y2="13.5"/>
      <polyline points="20,20 14,20 20,20 20,14"/>
      <line x1="20" y1="20" x2="13.5" y2="13.5"/>
    </g>
  </g>
  <text x="146" y="190" text-anchor="middle" fill="#f7f8f8" font-size="13" font-weight="500">Expand</text>


  <!-- ==================== CENTER CIRCLE (gradient stroke) ==================== -->
  <g filter="url(#glow)">
    <circle cx="300" cy="300" r="56" fill="url(#centerFill)" stroke="url(#centerGrad)" stroke-width="2"/>
    <circle cx="300" cy="300" r="64" fill="none" stroke="url(#centerGrad)" stroke-width="0.5" stroke-opacity="0.3"/>
  </g>
  <circle cx="300" cy="300" r="66" fill="none" stroke="url(#centerGrad)" stroke-width="0.5" stroke-opacity="0.15"/>

  <text x="300" y="294" text-anchor="middle" fill="#f7f8f8" font-size="13" font-weight="600">Recurring</text>
  <text x="300" y="312" text-anchor="middle" fill="#f7f8f8" font-size="13" font-weight="600">Revenue</text>

  <!-- Subtle connecting lines from center to each segment -->
  <g stroke-width="0.5" stroke-opacity="0.08" stroke-dasharray="4,6">
    <line x1="300" y1="234" x2="300" y2="110" stroke="#f59e0b"/>
    <line x1="347" y1="253" x2="426" y2="174" stroke="#ef7c3c"/>
    <line x1="366" y1="300" x2="490" y2="300" stroke="#e35d6a"/>
    <line x1="347" y1="347" x2="426" y2="426" stroke="#cc4990"/>
    <line x1="300" y1="366" x2="300" y2="490" stroke="#aa4db2"/>
    <line x1="253" y1="347" x2="174" y2="426" stroke="#8358c6"/>
    <line x1="234" y1="300" x2="110" y2="300" stroke="#5c6bd6"/>
    <line x1="253" y1="253" x2="174" y2="174" stroke="#3b82f6"/>
  </g>

</svg>