<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1052 300" width="1052" height="300">
  <defs>
    <!-- Green glow filter for the central engine -->
    <filter id="engineGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.102
                0 0 0 0 0.718
                0 0 0 0 0.349
                0 0 0 0.35 0" result="greenBlur"/>
      <feMerge>
        <feMergeNode in="greenBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow filter for data particles -->
    <filter id="dotGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Arrowhead markers -->
    <marker id="arrowRight" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#1ab759" stroke-width="1.2" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowRightOut" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="none" stroke="#1ab759" stroke-width="1.2" stroke-linejoin="round"/>
    </marker>

    <!-- Motion paths (invisible, used for animateMotion) -->
    <path id="pathJson" d="M240,60 L340,60 Q380,60 380,100 L380,150 L456,150"/>
    <path id="pathXml" d="M240,126 L340,126 Q380,126 380,140 L380,150 L456,150"/>
    <path id="pathCsv" d="M240,192 L340,192 Q380,192 380,170 L380,150 L456,150"/>
    <path id="pathSoap" d="M240,258 L340,258 Q380,258 380,200 L380,150 L456,150"/>
    <path id="pathOut" d="M596,150 L728,150"/>
  </defs>

  <!-- Background -->
  <rect width="1052" height="300" fill="#0c0c0c"/>

  <!-- ===================== -->
  <!-- LEFT: Data Format Nodes -->
  <!-- ===================== -->

  <!-- JSON Node -->
  <g transform="translate(120, 36)">
    <rect x="0" y="0" width="120" height="48" rx="8" ry="8"
          fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="28" y="29" font-family="'Inter','DM Sans',sans-serif" font-size="16" font-weight="600" fill="#f5a623" text-anchor="middle">{ }</text>
    <text x="72" y="29" font-family="'Inter','DM Sans',sans-serif" font-size="14" font-weight="500" fill="#f7f8f8" text-anchor="middle">JSON</text>
  </g>

  <!-- XML Node -->
  <g transform="translate(120, 102)">
    <rect x="0" y="0" width="120" height="48" rx="8" ry="8"
          fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <text x="28" y="29" font-family="'Inter','DM Sans',sans-serif" font-size="15" font-weight="600" fill="#5b9bd5" text-anchor="middle">&lt;/&gt;</text>
    <text x="72" y="29" font-family="'Inter','DM Sans',sans-serif" font-size="14" font-weight="500" fill="#f7f8f8" text-anchor="middle">XML</text>
  </g>

  <!-- CSV Node -->
  <g transform="translate(120, 168)">
    <rect x="0" y="0" width="120" height="48" rx="8" ry="8"
          fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <g transform="translate(16, 20)">
      <circle cx="4" cy="4" r="3" fill="none" stroke="#8bc34a" stroke-width="1.2"/>
      <circle cx="14" cy="4" r="3" fill="none" stroke="#8bc34a" stroke-width="1.2"/>
      <circle cx="24" cy="4" r="3" fill="none" stroke="#8bc34a" stroke-width="1.2"/>
    </g>
    <text x="72" y="29" font-family="'Inter','DM Sans',sans-serif" font-size="14" font-weight="500" fill="#f7f8f8" text-anchor="middle">CSV</text>
  </g>

  <!-- SOAP Node -->
  <g transform="translate(120, 234)">
    <rect x="0" y="0" width="120" height="48" rx="8" ry="8"
          fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <g transform="translate(14, 14)">
      <rect x="0" y="0" width="24" height="18" rx="2" ry="2" fill="none" stroke="#ce93d8" stroke-width="1.2"/>
      <polyline points="0,0 12,10 24,0" fill="none" stroke="#ce93d8" stroke-width="1.2"/>
    </g>
    <text x="72" y="29" font-family="'Inter','DM Sans',sans-serif" font-size="14" font-weight="500" fill="#f7f8f8" text-anchor="middle">SOAP</text>
  </g>

  <!-- ===================== -->
  <!-- FLOW LINES (static channels at lower opacity) -->
  <!-- ===================== -->

  <!-- JSON flow line -->
  <path d="M240,60 L340,60 Q380,60 380,100 L380,140"
        fill="none" stroke="#1ab759" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- XML flow line -->
  <path d="M240,126 L340,126 Q380,126 380,136 L380,140"
        fill="none" stroke="#1ab759" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- CSV flow line -->
  <path d="M240,192 L340,192 Q380,192 380,172 L380,160"
        fill="none" stroke="#1ab759" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- SOAP flow line -->
  <path d="M240,258 L340,258 Q380,258 380,200 L380,160"
        fill="none" stroke="#1ab759" stroke-width="1.5" stroke-opacity="0.35"/>

  <!-- Merged line from convergence to engine -->
  <line x1="380" y1="150" x2="448" y2="150"
        stroke="#1ab759" stroke-width="1.5" stroke-opacity="0.5" marker-end="url(#arrowRight)"/>

  <!-- Convergence dot -->
  <circle cx="380" cy="150" r="3" fill="#1ab759" fill-opacity="0.6"/>

  <!-- ===================== -->
  <!-- CENTER: Hexagonal Engine -->
  <!-- ===================== -->

  <!-- Engine hexagon with glow -->
  <g filter="url(#engineGlow)">
    <polygon points="456,150 491,100 561,100 596,150 561,200 491,200"
             fill="rgba(26,183,89,0.06)" stroke="#1ab759" stroke-width="1.8"/>
  </g>

  <!-- Inner hexagon with pulse animation -->
  <polygon points="472,150 498,114 554,114 580,150 554,186 498,186"
           fill="none" stroke="rgba(26,183,89,0.15)" stroke-width="1">
    <animate attributeName="stroke-opacity" values="0.08;0.3;0.08" dur="2.5s" repeatCount="indefinite"/>
  </polygon>

  <!-- Engine label: Unified XML Engine -->
  <text x="526" y="143" font-family="'Inter','DM Sans',sans-serif" font-size="12" font-weight="600" fill="#f7f8f8" text-anchor="middle" letter-spacing="0.5">Unified XML</text>
  <text x="526" y="163" font-family="'Inter','DM Sans',sans-serif" font-size="12" font-weight="600" fill="#f7f8f8" text-anchor="middle" letter-spacing="0.5">Engine</text>

  <!-- Processing indicator dots inside engine (alternating pulse) -->
  <circle cx="488" cy="150" r="2" fill="#1ab759">
    <animate attributeName="fill-opacity" values="0.2;0.7;0.2" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="526" cy="130" r="1.5" fill="#1ab759">
    <animate attributeName="fill-opacity" values="0.5;0.15;0.5" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="526" cy="170" r="1.5" fill="#1ab759">
    <animate attributeName="fill-opacity" values="0.15;0.5;0.15" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="564" cy="150" r="2" fill="#1ab759">
    <animate attributeName="fill-opacity" values="0.7;0.2;0.7" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- ===================== -->
  <!-- OUTPUT FLOW LINE -->
  <!-- ===================== -->

  <line x1="596" y1="150" x2="720" y2="150"
        stroke="#1ab759" stroke-width="1.5" stroke-opacity="0.5" marker-end="url(#arrowRightOut)"/>

  <!-- ===================== -->
  <!-- RIGHT: Normalized Data Node -->
  <!-- ===================== -->

  <g transform="translate(730, 120)">
    <rect x="0" y="0" width="170" height="60" rx="10" ry="10"
          fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.07)" stroke-width="1"/>
    <rect x="0" y="10" width="3" height="40" rx="1.5" ry="1.5" fill="#1ab759" fill-opacity="0.6"/>
    <g transform="translate(20, 18)">
      <rect x="0" y="2" width="18" height="20" rx="3" ry="3" fill="none" stroke="rgba(247,248,248,0.35)" stroke-width="1.2"/>
      <polyline points="4,13 8,17 16,7" fill="none" stroke="#1ab759" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="100" y="27" font-family="'Inter','DM Sans',sans-serif" font-size="14" font-weight="600" fill="#f7f8f8" text-anchor="middle">Normalized</text>
    <text x="100" y="46" font-family="'Inter','DM Sans',sans-serif" font-size="14" font-weight="600" fill="#f7f8f8" text-anchor="middle">Data</text>
  </g>

  <!-- =========================================== -->
  <!-- ANIMATED DATA PARTICLES                      -->
  <!-- Color-coded dots flowing from each format    -->
  <!-- through the engine, emerging as unified green -->
  <!-- =========================================== -->

  <!-- JSON particles (orange #f5a623) -->
  <circle r="4" fill="#f5a623" filter="url(#dotGlow)">
    <animateMotion dur="2.8s" repeatCount="indefinite" begin="0s">
      <mpath href="#pathJson"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.85;1" dur="2.8s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle r="3" fill="#f5a623" filter="url(#dotGlow)">
    <animateMotion dur="2.8s" repeatCount="indefinite" begin="1.4s">
      <mpath href="#pathJson"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.05;0.85;1" dur="2.8s" repeatCount="indefinite" begin="1.4s"/>
  </circle>

  <!-- XML particles (blue #5b9bd5) -->
  <circle r="4" fill="#5b9bd5" filter="url(#dotGlow)">
    <animateMotion dur="2.2s" repeatCount="indefinite" begin="0.4s">
      <mpath href="#pathXml"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.85;1" dur="2.2s" repeatCount="indefinite" begin="0.4s"/>
  </circle>
  <circle r="3" fill="#5b9bd5" filter="url(#dotGlow)">
    <animateMotion dur="2.2s" repeatCount="indefinite" begin="1.5s">
      <mpath href="#pathXml"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.05;0.85;1" dur="2.2s" repeatCount="indefinite" begin="1.5s"/>
  </circle>

  <!-- CSV particles (light green #8bc34a) -->
  <circle r="4" fill="#8bc34a" filter="url(#dotGlow)">
    <animateMotion dur="2.5s" repeatCount="indefinite" begin="0.8s">
      <mpath href="#pathCsv"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.85;1" dur="2.5s" repeatCount="indefinite" begin="0.8s"/>
  </circle>
  <circle r="3" fill="#8bc34a" filter="url(#dotGlow)">
    <animateMotion dur="2.5s" repeatCount="indefinite" begin="2.1s">
      <mpath href="#pathCsv"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.05;0.85;1" dur="2.5s" repeatCount="indefinite" begin="2.1s"/>
  </circle>

  <!-- SOAP particles (purple #ce93d8) -->
  <circle r="4" fill="#ce93d8" filter="url(#dotGlow)">
    <animateMotion dur="3.2s" repeatCount="indefinite" begin="1.1s">
      <mpath href="#pathSoap"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.05;0.85;1" dur="3.2s" repeatCount="indefinite" begin="1.1s"/>
  </circle>
  <circle r="3" fill="#ce93d8" filter="url(#dotGlow)">
    <animateMotion dur="3.2s" repeatCount="indefinite" begin="2.7s">
      <mpath href="#pathSoap"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;0.7;0.7;0" keyTimes="0;0.05;0.85;1" dur="3.2s" repeatCount="indefinite" begin="2.7s"/>
  </circle>

  <!-- Output particles (unified green #1ab759) -->
  <circle r="4" fill="#1ab759" filter="url(#dotGlow)">
    <animateMotion dur="1.5s" repeatCount="indefinite" begin="0s">
      <mpath href="#pathOut"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.75;1" dur="1.5s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle r="4" fill="#1ab759" filter="url(#dotGlow)">
    <animateMotion dur="1.5s" repeatCount="indefinite" begin="0.6s">
      <mpath href="#pathOut"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.75;1" dur="1.5s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
  <circle r="3" fill="#1ab759" filter="url(#dotGlow)">
    <animateMotion dur="1.5s" repeatCount="indefinite" begin="1.2s">
      <mpath href="#pathOut"/>
    </animateMotion>
    <animate attributeName="opacity" values="0;0.8;0.8;0" keyTimes="0;0.1;0.75;1" dur="1.5s" repeatCount="indefinite" begin="1.2s"/>
  </circle>

</svg>