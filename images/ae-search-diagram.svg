  <text x="600" y="1008" fill="rgba(255,255,255,0.7)" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle" font-weight="500">Find item id in</text>
  <text x="600" y="1024" fill="rgba(255,255,255,0.45)" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle">stored sell online product array</text>

  <!-- Connector + plus -->
  <line x1="600" y1="992" x2="600" y2="1050" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
