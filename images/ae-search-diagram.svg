      <path d="M0-13v4M0 9v4M-13 0h4M9 0h4M-9.2-9.2l2.8 2.8M6.4 6.4l2.8 2.8M9.2-9.2l-2.8 2.8M-6.4 6.4l-2.8 2.8"/>
