  <text x="600" y="445" fill="rgba(255,255,255,0.25)" font-family="Inter, system-ui, sans-serif" font-size="11" text-anchor="middle" letter-spacing="3" font-weight="600">ACTIONS</text>
  <text x="600" y="465" fill="rgba(255,255,255,0.4)" font-family="Inter, system-ui, sans-serif" font-size="12" text-anchor="middle">Execute the following actions</text>

