    <circle cx="600" cy="350" r="24" fill="none" stroke="rgba(26,183,89,0.2)" stroke-width="1"/>
    <!-- Gear icon -->
    <g transform="translate(600,350)" fill="none" stroke="#1ab759" stroke-width="1.8" stroke-linecap="round">
