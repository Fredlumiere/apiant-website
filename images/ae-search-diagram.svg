  <line x1="600" y1="478" x2="600" y2="500" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <polygon points="596,498 604,498 600,504" fill="rgba(255,255,255,0.15)"/>

  <!-- Plus button -->
  <circle cx="600" cy="520" r="14" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <line x1="594" y1="520" x2="606" y2="520" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="600" y1="514" x2="600" y2="526" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>

