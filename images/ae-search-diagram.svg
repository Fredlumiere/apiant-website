  <!-- Connector line: full vertical spine -->
  <line x1="600" y1="380" x2="600" y2="440" stroke="rgba(255,255,255,0.1)" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Subroutine Input node -->
  <g filter="url(#nodeShadow)">
