  <line x1="374" y1="1248" x2="386" y2="1248" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="380" y1="1242" x2="380" y2="1254" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>

  <line x1="380" y1="1262" x2="380" y2="1290" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <!-- False: Execute ADMIN 11 -->
  <g filter="url(#nodeShadow)">
