  <rect x="650" y="124" width="64" height="28" rx="6" fill="rgba(232,93,58,0.15)" stroke="rgba(232,93,58,0.3)" stroke-width="1"/>
  <text x="664" y="143" fill="#e85d3a" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="500">Hide</text>

  <!-- Dropdown menu -->
