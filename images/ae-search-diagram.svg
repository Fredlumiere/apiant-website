  <rect x="504" y="164" width="172" height="30" rx="4" fill="rgba(26,183,89,0.15)"/>
  <text x="520" y="184" fill="#1ab759" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500">action names</text>
  <text x="520" y="214" fill="rgba(255,255,255,0.7)" font-family="Inter, system-ui, sans-serif" font-size="13">action settings</text>
  <text x="520" y="244" fill="rgba(255,255,255,0.7)" font-family="Inter, system-ui, sans-serif" font-size="13">field mappings</text>
  <text x="520" y="274" fill="rgba(255,255,255,0.7)" font-family="Inter, system-ui, sans-serif" font-size="13">field names</text>

