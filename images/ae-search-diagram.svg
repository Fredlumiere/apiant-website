<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" width="1200" height="1600">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="topBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#13171e"/>
    </linearGradient>
    <linearGradient id="saveBtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1ab759"/>
      <stop offset="100%" stop-color="#15a04d"/>
    </linearGradient>
    <linearGradient id="cancelBtn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e85d3a"/>
      <stop offset="100%" stop-color="#d14b2a"/>
    </linearGradient>
    <linearGradient id="nodeGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(26,183,89,0.12)"/>
      <stop offset="100%" stop-color="rgba(26,183,89,0)"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="nodeShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="1600" fill="url(#bgGrad)"/>

  <!-- Subtle grid -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="0.5"/>
  </pattern>
  <rect width="1200" height="1600" fill="url(#grid)"/>

  <!-- Top nav -->
  <rect x="0" y="0" width="1200" height="44" fill="#0d1117" opacity="0.9"/>
  <line x1="0" y1="44" x2="1200" y2="44" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="870" y="28" fill="rgba(255,255,255,0.5)" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400">Create an Automation</text>
  <text x="1070" y="28" fill="rgba(255,255,255,0.5)" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400">Connections</text>

  <!-- Subroutine name bar -->
  <rect x="0" y="44" width="1200" height="56" fill="url(#topBar)" filter="url(#softShadow)"/>
  <line x1="0" y1="100" x2="1200" y2="100" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="60" y="78" fill="rgba(255,255,255,0.6)" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="500" letter-spacing="0.3">Subroutine name:</text>
  <rect x="200" y="58" width="560" height="32" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="216" y="79" fill="rgba(255,255,255,0.85)" font-family="Inter, system-ui, sans-serif" font-size="13">Check if Mindbody item id is sellable online</text>
  <rect x="790" y="58" width="80" height="32" rx="6" fill="url(#saveBtn)"/>
  <text x="814" y="79" fill="#fff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">Save</text>
  <rect x="885" y="58" width="80" height="32" rx="6" fill="url(#cancelBtn)"/>
  <text x="903" y="79" fill="#fff" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600">Cancel</text>

  <!-- Search bar area -->
  <rect x="140" y="120" width="340" height="34" rx="8" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <circle cx="158" cy="137" r="8" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <line x1="164" y1="143" x2="168" y2="147" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" stroke-linecap="round"/>
  <text x="178" y="142" fill="rgba(255,255,255,0.3)" font-family="Inter, system-ui, sans-serif" font-size="13">Search...</text>

  <!-- Dropdown -->
